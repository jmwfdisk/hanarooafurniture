    // ── 웹 푸시 ───────────────────────────────────────────────────────────
    //
    // 토큰은 msgProfiles/{내 uid}/private/tokens 에 배열로 쌓는다.
    // 폰·PC를 함께 쓰면 기기마다 토큰이 다르므로 배열이고, 규칙상 본인만 읽고 쓴다
    // (임직원끼리도 서로의 토큰을 볼 수 없다). 발송은 Admin SDK가 읽어 처리한다.
    //
    // 웹 푸시 인증서 공개키 (콘솔: 프로젝트 설정 → 클라우드 메시징 → 웹 구성 → 웹 푸시 인증서).
    // 공개키라 클라이언트 코드에 그대로 들어간다 — 비밀키는 콘솔에만 남는다.
    // 값이 비면 푸시만 조용히 꺼지고 대화 기능은 정상 동작한다.
    var VAPID_KEY = 'BCyHIur6_b1O7smM3Qz4P3nzgLbb8tW161mDCsMSZuWlf6SGxNto2aES_mOfA6WbaDJWhVIE04qR_tZVYqQZiHg';

    function setupPush() {
        if (!VAPID_KEY) {
            console.info('[메신저] VAPID 키가 없어 웹 푸시를 건너뜁니다.');
            return;
        }
        if (!('serviceWorker' in navigator) || !('Notification' in window)) return;
        if (typeof firebase.messaging !== 'function') return;
        // iOS Safari 는 홈 화면에 추가한 경우에만 웹 푸시를 지원한다.
        if (!firebase.messaging.isSupported || !firebase.messaging.isSupported()) return;

        // 이미 거부한 사용자에게 매번 다시 묻지 않는다.
        if (Notification.permission === 'denied') return;

        var start = Notification.permission === 'granted'
            ? Promise.resolve('granted')
            : Notification.requestPermission();

        start.then(function (perm) {
            if (perm !== 'granted') return;
            // 서비스워커는 사이트 루트에 있다 (스코프가 사이트 전체이므로 fetch 는 다루지 않는다)
            return navigator.serviceWorker.register('/firebase-messaging-sw.js')
                .then(function (reg) {
                    return firebase.messaging().getToken({
                        vapidKey: VAPID_KEY,
                        serviceWorkerRegistration: reg
                    });
                })
                .then(saveFcmToken);
        }).catch(function (err) {
            // 푸시는 부가 기능이다 — 실패해도 대화에는 지장이 없어야 한다.
            console.warn('[메신저] 웹 푸시 준비 실패:', err);
        });
    }

    function saveFcmToken(token) {
        var d = getDb();
        if (!token || !d) return;

        // 문서가 없을 수 있으므로 set(merge) — update 는 없는 문서에서 실패한다.
        return d.collection('msgProfiles').doc(meUid)
            .collection('private').doc('tokens')
            .set({ tokens: firebase.firestore.FieldValue.arrayUnion(token) }, { merge: true })
            .catch(function (err) {
                console.warn('[메신저] 푸시 토큰 저장 실패:', err);
            });
    }

    // ── 첨부 (사진·파일) ──────────────────────────────────────────────────
    //
    // Storage 규칙(messenger/chat-media/{uid}/{file}):
    //   내 uid 경로에만 · 20MB 미만 · contentType 필수 · text/html·image/svg 금지
    // 규칙이 막기는 하지만, 올린 뒤 거부당하면 시간만 버리므로 보내기 전에 같은 조건을 본다.
    var MAX_ATTACH_BYTES = 20 * 1024 * 1024;
    // 개인정보성 첨부라 공용 캐시(프록시)에 남지 않게 private. 파일명이 매번 유일해 1년 캐시가 안전하다.
    var ATTACH_CACHE_CONTROL = 'private, max-age=31536000';
    var IMAGE_MAX_EDGE = 1600;      // 원본을 그대로 올리면 대화 로딩이 느려진다

    var currentUploadTask = null;

    function humanSize(bytes) {
        var n = Number(bytes) || 0;
        if (n < 1024) return n + ' B';
        if (n < 1024 * 1024) return (n / 1024).toFixed(0) + ' KB';
        return (n / 1024 / 1024).toFixed(1) + ' MB';
    }

    /** Storage 경로에 쓸 안전한 파일명. 원본 이름은 fileName 필드에 따로 남긴다. */
    function safeFileName(name) {
        var dot = String(name || '').lastIndexOf('.');
        var ext = dot > -1 ? String(name).slice(dot + 1).toLowerCase().replace(/[^a-z0-9]/g, '') : '';
        return Date.now() + '_' + Math.random().toString(36).slice(2, 8) + (ext ? '.' + ext : '');
    }

    /**
     * 이미지를 긴 변 기준으로 줄인다. 실패하면(HEIC 등 브라우저가 못 읽는 형식)
     * 원본을 그대로 쓴다 — 줄이기는 최적화일 뿐 기능이 아니다.
     */
    function shrinkImage(file) {
        return new Promise(function (resolve) {
            if (!/^image\//.test(file.type) || /svg/.test(file.type)) { resolve(file); return; }

            var url = URL.createObjectURL(file);
            var img = new Image();
            img.onload = function () {
                try {
                    var w = img.naturalWidth, h = img.naturalHeight;
                    var scale = Math.min(1, IMAGE_MAX_EDGE / Math.max(w, h));
                    if (scale >= 1) { URL.revokeObjectURL(url); resolve(file); return; }

                    var canvas = document.createElement('canvas');
                    canvas.width = Math.round(w * scale);
                    canvas.height = Math.round(h * scale);
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    canvas.toBlob(function (blob) {
                        URL.revokeObjectURL(url);
                        resolve(blob && blob.size < file.size ? blob : file);
                    }, 'image/jpeg', 0.85);
                } catch (e) {
                    URL.revokeObjectURL(url);
                    resolve(file);
                }
            };
            img.onerror = function () { URL.revokeObjectURL(url); resolve(file); };
            img.src = url;
        });
    }

    function showUpload(on, name) {
        var box = byId('msg-upload');
        if (box) box.classList.toggle('on', !!on);
        var label = byId('msg-upload-name');
        if (label && name != null) label.textContent = name;
        if (!on) setProgress(0);
    }

    function setProgress(pct) {
        var bar = byId('msg-progress-bar');
        if (bar) bar.style.width = Math.max(0, Math.min(100, pct)) + '%';
    }

    function handleAttach(file) {
        var d = getDb();
        if (!file || !d || !currentRoomId || currentUploadTask) return;

        if (/^text\/html/.test(file.type) || /svg/.test(file.type)) {
            alert('이 형식은 보낼 수 없습니다. (HTML·SVG)');
            return;
        }

        var roomId = currentRoomId;
        var isImage = /^image\//.test(file.type) && !/svg/.test(file.type);

        showUpload(true, file.name);
        setProgress(0);

        shrinkImage(file).then(function (payload) {
            if (payload.size >= MAX_ATTACH_BYTES) {
                showUpload(false);
                alert('20MB 미만 파일만 보낼 수 있습니다. (현재 ' + humanSize(payload.size) + ')');
                return;
            }
            if (currentRoomId !== roomId) { showUpload(false); return; }   // 그 사이 방 이동

            var path = 'messenger/chat-media/' + meUid + '/' + safeFileName(file.name);
            var ref = firebase.storage().ref(path);

            currentUploadTask = ref.put(payload, {
                contentType: payload.type || file.type || 'application/octet-stream',
                cacheControl: ATTACH_CACHE_CONTROL
            });

            currentUploadTask.on('state_changed',
                function (snap) {
                    setProgress(snap.totalBytes ? (snap.bytesTransferred / snap.totalBytes) * 100 : 0);
                },
                function (err) {
                    currentUploadTask = null;
                    showUpload(false);
                    if (err && err.code === 'storage/canceled') return;
                    console.error('[메신저] 업로드 실패:', err);
                    alert('첨부를 올리지 못했습니다. 다시 시도해 주세요.');
                },
                function () {
                    currentUploadTask.snapshot.ref.getDownloadURL().then(function (url) {
                        currentUploadTask = null;
                        showUpload(false);
                        if (currentRoomId !== roomId) return;
                        sendAttachment(d, roomId, url, file, payload, isImage);
                    }).catch(function (err) {
                        currentUploadTask = null;
                        showUpload(false);
                        console.error('[메신저] 다운로드 URL 조회 실패:', err);
                        alert('첨부 주소를 가져오지 못했습니다.');
                    });
                });
        });
    }

    function sendAttachment(d, roomId, url, original, payload, isImage) {
        var roomRef = d.collection('msgRooms').doc(roomId);
        var msgRef = roomRef.collection('messages').doc();

        var body = {
            senderId: meUid,
            senderName: (meData && meData.name) || '',
            text: '',
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        };
        if (isImage) {
            body.imageUrl = url;
        } else {
            body.fileUrl = url;
            body.fileName = original.name || '첨부파일';
            body.fileSize = payload.size || original.size || 0;
        }

        var batch = d.batch();
        batch.set(msgRef, body);
        batch.update(roomRef, {
            lastMessage: isImage ? '사진' : ('파일: ' + (original.name || '')),
            lastMessageTime: firebase.firestore.FieldValue.serverTimestamp(),
            messageCount: firebase.firestore.FieldValue.increment(1)
        });

        batch.commit().catch(function (err) {
            console.error('[메신저] 첨부 전송 실패:', err);
            alert('첨부를 보내지 못했습니다.');
        });
    }

    // ── 온라인 상태 ───────────────────────────────────────────────────────
    //
    // msgProfiles/{내 uid}.lastSeen 을 3분마다 갱신하고, 4분 이내면 접속 중으로 본다
    // (기획서 6절). 규칙이 본인의 photoUrl·statusMessage·lastSeen 만 허용한다.
    // 초 단위를 노출하지 않는 것은 근태 감시로 읽히지 않게 하려는 의도다.
    var LAST_SEEN_INTERVAL = 3 * 60 * 1000;
    var ONLINE_WINDOW = 4 * 60 * 1000;

    function isOnline(profile) {
        var dt = toDate(profile && profile.lastSeen);
        return !!dt && (Date.now() - dt.getTime() < ONLINE_WINDOW);
    }

    function touchLastSeen() {
        var d = getDb();
        if (!d) return;
        // 자동 로그아웃 예외와 같은 기준 — 오래 방치된 PC를 계속 접속 중으로 보이게 두지 않는다.
        if (Date.now() - lastInputAt > KEEPALIVE_MAX_IDLE) return;

        d.collection('msgProfiles').doc(meUid)
            .update({ lastSeen: firebase.firestore.FieldValue.serverTimestamp() })
            .catch(function (err) {
                console.error('[메신저] 접속 시각 갱신 실패:', err);
            });
    }

    function setupPresence() {
        touchLastSeen();
        setInterval(touchLastSeen, LAST_SEEN_INTERVAL);
    }

    /** 입력창 높이를 내용에 맞춘다 (최대치는 CSS max-height) */
    function autoGrow(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    // ── 이벤트 ────────────────────────────────────────────────────────────

    function bindEvents() {
        var tree = byId('msg-tree');
        if (tree) {
            // 목록이 매번 다시 그려지므로 개별 바인딩 대신 위임한다.
            tree.addEventListener('click', function (e) {
                var head = e.target.closest ? e.target.closest('.msg-group-head') : null;
                if (head) {
                    var group = head.parentElement;
                    var org = group.getAttribute('data-org');
                    group.classList.toggle('collapsed');
                    collapsedOrgs[org] = group.classList.contains('collapsed');
                    return;
                }
                var person = e.target.closest ? e.target.closest('.msg-person') : null;
                if (!person) return;
                var uid = person.getAttribute('data-uid');
                if (picking) togglePick(uid);       // 선택 모드에서는 방을 열지 않는다
                else selectPerson(uid);
            });
        }

        var search = byId('msg-search');
        if (search) search.addEventListener('input', renderTree);

        var back = byId('msg-back');
        if (back) back.addEventListener('click', function () {
            document.body.classList.remove('msg-detail');
        });

        var form = byId('msg-form');
        if (form) form.addEventListener('submit', function (e) {
            e.preventDefault();
            sendMessage();
        });

        // ── 말풍선 조작 (답장·반응·수정·삭제) ──
        var chatEl = byId('msg-chat');
        if (chatEl) {
            // 반응 칩 클릭 — 토글
            chatEl.addEventListener('click', function (e) {
                var chip = e.target.closest ? e.target.closest('.msg-react') : null;
                if (!chip) return;
                e.preventDefault();
                toggleReaction(chip.getAttribute('data-react-msg'), chip.getAttribute('data-react-emoji'));
            });

            // 우클릭 → 메뉴 (PC 주 사용 환경)
            chatEl.addEventListener('contextmenu', function (e) {
                var row = e.target.closest ? e.target.closest('.msg-row') : null;
                if (!row) return;
                e.preventDefault();
                openMsgMenu(row.getAttribute('data-msg-id'), e.clientX, e.clientY);
            });

            // 길게 누르기 → 메뉴 (터치 기기). 손가락이 움직이면 스크롤로 보고 취소한다.
            var pressTimer = null, pressX = 0, pressY = 0;
            chatEl.addEventListener('touchstart', function (e) {
                var row = e.target.closest ? e.target.closest('.msg-row') : null;
                if (!row || !e.touches[0]) return;
                pressX = e.touches[0].clientX; pressY = e.touches[0].clientY;
                pressTimer = setTimeout(function () {
                    openMsgMenu(row.getAttribute('data-msg-id'), pressX, pressY);
                }, 450);
            }, { passive: true });
            chatEl.addEventListener('touchmove', function (e) {
                if (!pressTimer || !e.touches[0]) return;
                if (Math.abs(e.touches[0].clientX - pressX) > 10 ||
                    Math.abs(e.touches[0].clientY - pressY) > 10) {
                    clearTimeout(pressTimer); pressTimer = null;
                }
            }, { passive: true });
            chatEl.addEventListener('touchend', function () {
                if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
            });
        }

        // 메뉴 항목 실행 — 메뉴는 body 에 붙으므로 document 에 위임한다
        document.addEventListener('click', function (e) {
            var menu = byId('msg-msg-menu');
            if (!menu) return;
            if (!menu.contains(e.target)) { closeMsgMenu(); return; }

            // 방 메뉴(고정·알림·폴더·숨기기)
            var roomId = menu.getAttribute('data-room-id');
            if (roomId) {
                var rItem = e.target.closest ? e.target.closest('.msg-menu-item') : null;
                if (!rItem) return;
                var rAct = rItem.getAttribute('data-act');
                closeMsgMenu();
                if (rAct === 'pin') toggleRoomPref('pinnedRooms', roomId, !inArr(myPrefs.pinnedRooms, roomId));
                else if (rAct === 'mute') toggleRoomPref('mutedRooms', roomId, !inArr(myPrefs.mutedRooms, roomId));
                else if (rAct === 'folder') toggleRoomInFolder(roomId, rItem.getAttribute('data-folder'));
                else if (rAct === 'hide') {
                    if (confirm('이 대화를 목록에서 숨길까요?\n대화 내용은 지워지지 않습니다.')) {
                        toggleRoomPref('hiddenRooms', roomId, true);
                    }
                }
                return;
            }

            var msgId = menu.getAttribute('data-msg-id');
            var emoji = e.target.closest ? e.target.closest('.msg-menu-emoji') : null;
            if (emoji) {
                toggleReaction(msgId, emoji.getAttribute('data-emoji'));
                closeMsgMenu();
                return;
            }
            var item = e.target.closest ? e.target.closest('.msg-menu-item') : null;
            if (!item) return;
            var act = item.getAttribute('data-act');
            var m = msgById(msgId);
            closeMsgMenu();
            if (!m) return;

            if (act === 'reply') setReplyTarget(m);
            else if (act === 'copy') {
                if (navigator.clipboard) navigator.clipboard.writeText(m.text || '');
            } else if (act === 'notice') {
                var box = byId('msg-notice-input');
                if (box) box.value = m.text || '';
                saveNotice();
            } else if (act === 'edit') setEditTarget(m);
            else if (act === 'delete') {
                if (confirm('이 메시지를 삭제할까요?\n상대 화면에는 "삭제된 메시지입니다"로 남습니다.')) {
                    deleteMessage(msgId);
                }
            }
        });
        document.addEventListener('scroll', closeMsgMenu, true);
        window.addEventListener('resize', closeMsgMenu);

        // 📁 폴더 칩
        var folders = byId('msg-folders');
        if (folders) folders.addEventListener('click', function (e) {
            var add = e.target.closest ? e.target.closest('#msg-folder-add') : null;
            if (add) { createFolder(); return; }
            var chip = e.target.closest ? e.target.closest('.msg-chip') : null;
            if (!chip) return;
            selectedFolder = chip.getAttribute('data-folder');
            renderRooms();
        });
        // 칩 우클릭 → 폴더 삭제 (기본 칩 2개는 지울 수 없다)
        if (folders) folders.addEventListener('contextmenu', function (e) {
            var chip = e.target.closest ? e.target.closest('.msg-chip') : null;
            if (!chip) return;
            var name = chip.getAttribute('data-folder');
            if (!name || name === '전체' || name === '안읽음') return;
            e.preventDefault();
            if (confirm('폴더 \'' + name + '\' 을(를) 삭제할까요?\n대화는 지워지지 않습니다.')) deleteFolder(name);
        });

        // 대화 목록 우클릭 → 방 메뉴
        var roomsBox = byId('msg-rooms');
        if (roomsBox) roomsBox.addEventListener('contextmenu', function (e) {
            var btn = e.target.closest ? e.target.closest('.msg-room') : null;
            if (!btn) return;
            e.preventDefault();
            openRoomMenu(btn.getAttribute('data-room'), e.clientX, e.clientY);
        });

        // ── ⚙️ 설정 ──
        var setBtn = byId('msg-settings-btn');
        if (setBtn) setBtn.addEventListener('click', function () {
            // 관리자에게만 거래처 배정 항목을 연다 (실제 차단은 msgPartners 쓰기 규칙)
            var isAdmin = !!(meData && meData.isAdmin === true);
            byId('msg-set-admin-sec').hidden = !isAdmin;
            byId('msg-set-partners').hidden = !isAdmin;
            loadNotifPreview();
            loadMyProfileForm();
            byId('msg-settings-modal').hidden = false;
        });
        var setClose = byId('msg-settings-close');
        if (setClose) setClose.addEventListener('click', function () {
            byId('msg-settings-modal').hidden = true;
        });
        var prevBox = byId('msg-set-preview');
        if (prevBox) prevBox.addEventListener('change', function () { saveNotifPreview(prevBox.checked); });

        var consentBtn = byId('msg-set-consent');
        if (consentBtn) consentBtn.addEventListener('click', function () {
            openTextModal('이용 안내·개인정보 처리방침', CONSENT_TEXT);
        });
        var licenseBtn = byId('msg-set-license');
        if (licenseBtn) licenseBtn.addEventListener('click', function () {
            openTextModal('오픈소스 라이선스', LICENSE_TEXT);
        });
        var textClose = byId('msg-text-close');
        if (textClose) textClose.addEventListener('click', function () {
            byId('msg-text-modal').hidden = true;
        });

        var blockedBtn = byId('msg-set-blocked');
        if (blockedBtn) blockedBtn.addEventListener('click', openBlockedModal);
        var devicesBtn = byId('msg-set-devices');
        if (devicesBtn) devicesBtn.addEventListener('click', openDevicesModal);

        var partnersBtn = byId('msg-set-partners');
        if (partnersBtn) partnersBtn.addEventListener('click', openPartnerModal);
        var partnerClose = byId('msg-partner-close');
        if (partnerClose) partnerClose.addEventListener('click', function () {
            byId('msg-partner-modal').hidden = true;
        });
        var partnerBody = byId('msg-partner-body');
        if (partnerBody) partnerBody.addEventListener('click', function (e) {
            var chip = e.target.closest ? e.target.closest('.msg-mgr') : null;
            if (!chip) return;
            var on = !chip.classList.contains('on');
            chip.classList.toggle('on', on);      // 낙관적 반영 — 실패하면 알림이 뜬다
            togglePartnerManager(chip.getAttribute('data-partner'), chip.getAttribute('data-mgr'), on);
        });

        // 🔎 대화 내 검색
        var csBtn = byId('msg-chatsearch-btn');
        var csBar = byId('msg-chatsearch');
        var csInput = byId('msg-chatsearch-input');
        if (csBtn) csBtn.addEventListener('click', function () {
            csBar.hidden = !csBar.hidden;
            if (!csBar.hidden) { csInput.focus(); }
            else { csInput.value = ''; setChatQuery(''); }
        });
        if (csInput) csInput.addEventListener('input', function () { setChatQuery(csInput.value); });
        var csClose = byId('msg-chatsearch-close');
        if (csClose) csClose.addEventListener('click', function () {
            csBar.hidden = true; csInput.value = ''; setChatQuery('');
        });

        // 👤 프로필
        var statusBox = byId('msg-set-status');
        if (statusBox) statusBox.addEventListener('change', function () { saveStatusMessage(statusBox.value); });
        var photoBtn = byId('msg-set-photo');
        var photoFile = byId('msg-photo-file');
        if (photoBtn && photoFile) {
            photoBtn.addEventListener('click', function () { photoFile.click(); });
            photoFile.addEventListener('change', function () {
                if (photoFile.files && photoFile.files[0]) uploadProfilePhoto(photoFile.files[0]);
                photoFile.value = '';
            });
        }

        var renameBtn = byId('msg-room-rename');
        if (renameBtn) renameBtn.addEventListener('click', renameRoom);
        var clearBtn = byId('msg-room-clear');
        if (clearBtn) clearBtn.addEventListener('click', clearChatHistory);

        var voiceBtn = byId('msg-voice');
        if (voiceBtn) voiceBtn.addEventListener('click', function () {
            if (mediaRecorder) stopVoiceRecording(true); else startVoiceRecording();
        });
        var recStop = byId('msg-rec-stop');
        if (recStop) recStop.addEventListener('click', function () { stopVoiceRecording(true); });
        var recCancel = byId('msg-rec-cancel');
        if (recCancel) recCancel.addEventListener('click', function () { stopVoiceRecording(false); });

        var schedBtn = byId('msg-schedule');
        if (schedBtn) schedBtn.addEventListener('click', scheduleMessage);

        var replyCancel = byId('msg-reply-cancel');
        if (replyCancel) replyCancel.addEventListener('click', function () { setReplyTarget(null); });
        var editCancel = byId('msg-edit-cancel');
        if (editCancel) editCancel.addEventListener('click', function () { setEditTarget(null); });

        var roomsBox = byId('msg-rooms');
        if (roomsBox) roomsBox.addEventListener('click', function (e) {
            var btn = e.target.closest ? e.target.closest('.msg-room') : null;
            if (!btn) return;
            var id = btn.getAttribute('data-room');
            for (var i = 0; i < rooms.length; i++) {
                if (rooms[i].id === id) { openRoomFromList(rooms[i]); return; }
            }
        });

        Array.prototype.forEach.call(document.querySelectorAll('.msg-tab'), function (tab) {
            tab.addEventListener('click', function () { switchPane(tab.getAttribute('data-pane')); });
        });

        var attachBtn = byId('msg-attach');
        var fileInput = byId('msg-file');
        if (attachBtn && fileInput) {
            attachBtn.addEventListener('click', function () { fileInput.click(); });
            fileInput.addEventListener('change', function () {
                var f = fileInput.files && fileInput.files[0];
                // 같은 파일을 다시 고를 수 있게 값을 비운다 (change 가 안 나는 것을 막는다)
                fileInput.value = '';
                if (f) handleAttach(f);
            });
        }

        // ── 그룹 만들기 / 초대 ──
        var groupStart = byId('msg-group-start');
        if (groupStart) groupStart.addEventListener('click', function () { setPicking(true, false); });

        var groupCancel = byId('msg-group-cancel');
        if (groupCancel) groupCancel.addEventListener('click', function () { setPicking(false); });

        var groupNext = byId('msg-group-next');
        if (groupNext) groupNext.addEventListener('click', function () {
            if (inviteMode) inviteToRoom();
            else openGroupNameModal();
        });

        var groupClose = byId('msg-group-close');
        if (groupClose) groupClose.addEventListener('click', function () {
            byId('msg-group-modal').hidden = true;
        });

        var groupCreate = byId('msg-group-create');
        if (groupCreate) groupCreate.addEventListener('click', createGroupRoom);

        // ── 대화방 정보 ──
        var roomMenu = byId('msg-roommenu');
        if (roomMenu) roomMenu.addEventListener('click', openRoomModal);

        var roomClose = byId('msg-room-close');
        if (roomClose) roomClose.addEventListener('click', function () {
            byId('msg-room-modal').hidden = true;
        });

        var roomInvite = byId('msg-room-invite');
        if (roomInvite) roomInvite.addEventListener('click', function () {
            byId('msg-room-modal').hidden = true;
            setPicking(true, true);
        });

        var roomLeave = byId('msg-room-leave');
        if (roomLeave) roomLeave.addEventListener('click', leaveRoom);

        var noticeSave = byId('msg-notice-save');
        if (noticeSave) noticeSave.addEventListener('click', saveNotice);

        // 모달 바깥을 눌러도 닫힌다
        ['msg-group-modal', 'msg-room-modal'].forEach(function (id) {
            var el = byId(id);
            if (el) el.addEventListener('click', function (e) {
                if (e.target === el) el.hidden = true;
            });
        });

        var cancelBtn = byId('msg-upload-cancel');
        if (cancelBtn) cancelBtn.addEventListener('click', function () {
            if (currentUploadTask) { try { currentUploadTask.cancel(); } catch (e) { /* 무시 */ } }
        });

        // 사진 클릭 시 새 탭에서 원본 보기
        var chatBox = byId('msg-chat');
        if (chatBox) chatBox.addEventListener('click', function (e) {
            var img = e.target && e.target.classList && e.target.classList.contains('msg-image')
                ? e.target : null;
            if (!img) return;
            var url = safeUrl(img.getAttribute('data-full'));
            if (url) window.open(url, '_blank', 'noopener');
        });

        var input = byId('msg-input');
        if (input) {
            input.addEventListener('input', function () {
                autoGrow(input);
                if (input.value) signalTyping(); else stopTypingSignal();
            });
            input.addEventListener('keydown', function (e) {
                if (e.key !== 'Enter' || e.shiftKey) return;
                // 한글 조합 중의 Enter 는 글자 확정용이다 — 여기서 보내면
                // 마지막 글자가 잘리거나 같은 메시지가 두 번 나간다.
                if (e.isComposing || e.keyCode === 229) return;
                e.preventDefault();
                sendMessage();
            });
        }

        var mypage = byId('msg-mypage-btn');
        if (mypage) mypage.addEventListener('click', function () {
            if (typeof window.showMyPage === 'function') window.showMyPage();
        });

        var logoutBtn = byId('msg-logout-btn');
        if (logoutBtn) logoutBtn.addEventListener('click', function () {
            if (typeof window.logout === 'function') window.logout();
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bindEvents);
    } else {
        bindEvents();
    }
})();
</script>


<!-- ⚙️ 설정 — 앱의 설정 탭과 같은 항목을 웹에서도 (알림 미리보기 · 이용안내 · 라이선스 · 문의) -->
<div class="msg-modal" id="msg-settings-modal" hidden>
    <div class="msg-modal-box">
        <div class="msg-modal-head">설정</div>
        <div class="msg-modal-body">
            <div class="msg-set-sec">내 프로필</div>
            <label class="msg-set-row">
                <span>
                    <b>상태 메시지</b>
                    <small>조직도에서 이름 아래에 보여요 (이름·부서·직급은 홈페이지에서 관리)</small>
                </span>
                <input type="text" id="msg-set-status" maxlength="40" placeholder="예: 외근 중"
                       style="width:130px;padding:6px 8px;border:1px solid var(--msg-line);border-radius:8px;font:inherit;font-size:12.5px;">
            </label>
            <button type="button" class="msg-set-row as-btn" id="msg-set-photo">
                <span><b>프로필 사진 바꾸기</b><small>5MB 이하 이미지</small></span>
                <span class="msg-set-arrow">›</span>
            </button>
            <input type="file" id="msg-photo-file" accept="image/*" hidden>

            <div class="msg-set-sec">알림</div>
            <label class="msg-set-row">
                <span>
                    <b>알림 미리보기</b>
                    <small>끄면 알림에 보낸 사람·내용 대신 "새 메시지가 도착했어요"만 표시돼요</small>
                </span>
                <input type="checkbox" id="msg-set-preview">
            </label>

            <div class="msg-set-sec" id="msg-set-admin-sec" hidden>관리자</div>
            <button type="button" class="msg-set-row as-btn" id="msg-set-partners" hidden>
                <span>
                    <b>거래처 담당자 배정</b>
                    <small>거래처는 배정된 담당자와만 대화할 수 있어요</small>
                </span>
                <span class="msg-set-arrow">›</span>
            </button>

            <div class="msg-set-sec">개인정보·보안</div>
            <button type="button" class="msg-set-row as-btn" id="msg-set-blocked">
                <span><b>차단 목록</b><small>차단한 사람은 나에게 말을 걸 수 없어요</small></span>
                <span class="msg-set-arrow">›</span>
            </button>
            <button type="button" class="msg-set-row as-btn" id="msg-set-devices">
                <span><b>로그인된 기기</b><small>휴대폰·태블릿·PC 각각 1대까지 쓸 수 있어요</small></span>
                <span class="msg-set-arrow">›</span>
            </button>

            <div class="msg-set-sec">정보</div>
            <button type="button" class="msg-set-row as-btn" id="msg-set-consent">
                <span><b>이용 안내·개인정보 처리방침</b></span>
                <span class="msg-set-arrow">›</span>
            </button>
            <button type="button" class="msg-set-row as-btn" id="msg-set-license">
                <span><b>오픈소스 라이선스</b></span>
                <span class="msg-set-arrow">›</span>
            </button>
            <a class="msg-set-row as-btn" id="msg-set-contact"
               href="mailto:oa9500@empas.com?subject=하나로%20메신저%20문의">
                <span><b>문의하기</b><small>버그 제보·기능 제안을 메일로 보내요</small></span>
                <span class="msg-set-arrow">›</span>
            </a>
        </div>
        <div class="msg-modal-foot">
            <button type="button" class="msg-pill" id="msg-settings-close">닫기</button>
        </div>
    </div>
</div>

<!-- 📄 긴 글 보기 (이용안내·라이선스 공용) -->
<div class="msg-modal" id="msg-text-modal" hidden>
    <div class="msg-modal-box">
        <div class="msg-modal-head" id="msg-text-title">안내</div>
        <div class="msg-modal-body"><pre class="msg-longtext" id="msg-text-body"></pre></div>
        <div class="msg-modal-foot">
            <button type="button" class="msg-pill" id="msg-text-close">닫기</button>
        </div>
    </div>
</div>

<!-- 🤝 거래처 담당자 배정 (관리자 전용) -->
<div class="msg-modal" id="msg-partner-modal" hidden>
    <div class="msg-modal-box">
        <div class="msg-modal-head">거래처 담당자 배정</div>
        <div class="msg-modal-body" id="msg-partner-body"></div>
        <div class="msg-modal-foot">
            <button type="button" class="msg-pill" id="msg-partner-close">닫기</button>
        </div>
    </div>
</div>

</body>
</html>
