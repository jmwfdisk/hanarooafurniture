<!-- 홈페이지 공용 인증 싱글톤. 캐시버스트 값은 홈페이지 전 페이지와 같아야 한다. -->
<script src="../js/auth.js?v=20260714a"></script>

<script>
// ═══════════════════════════════════════════════════════════════════════════
//  하나로 메신저 — 1단계 A: 조직도 + 접근 제어 + 자동 로그아웃 예외
//
//  데이터 규약은 `앱 개발/Hanaro Messenger/데이터_스키마.md` 를 따른다.
//  - 조직도는 users가 아니라 msgProfiles 를 읽는다 (users는 규칙상 서로 못 읽는다)
//  - 거래처(userType!=='employee')는 msgProfiles 목록 조회가 규칙에서 거부된다
//    → 쿼리를 아예 날리지 않는다. 날리면 콘솔에 permission-denied 가 쌓인다.
// ═══════════════════════════════════════════════════════════════════════════

(function () {
    'use strict';

    // ── 상태 ──────────────────────────────────────────────────────────────
    var db = null;
    var meUid = null;
    var meData = null;
    var profiles = [];          // msgProfiles 문서 배열
    var selectedUid = null;
    var accessGranted = false;
    var collapsedOrgs = {};     // 부서명 → true(접힘)

    // ── 유틸 ──────────────────────────────────────────────────────────────

    /** innerHTML 에 넣기 전 이스케이프 (홈페이지 공통 규약) */
    function esc(v) {
        return String(v == null ? '' : v)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function byId(id) { return document.getElementById(id); }

    /**
     * 링크·이미지 주소로 쓸 수 있는 값만 통과시킨다.
     *
     * 첨부 주소는 메시지 문서에 그냥 문자열로 들어 있고, 보안규칙은 그 값을 검사하지 않는다
     * (senderId 만 본다). 즉 방 참여자가 `javascript:` 로 시작하는 값을 직접 써 넣으면
     * 상대가 클릭하는 순간 스크립트가 돈다. https 로 시작하는 것만 허용해 원천 차단한다.
     */
    function safeUrl(v) {
        var s = String(v == null ? '' : v).trim();
        return /^https:\/\//i.test(s) ? s : '';
    }

    /** 이름 첫 글자 (아바타용). 빈 값이면 물음표 */
    function initial(name) {
        var s = String(name || '').trim();
        return s ? s.charAt(0) : '?';
    }

    /** 한국어 우선 정렬 */
    function ko(a, b) { return String(a || '').localeCompare(String(b || ''), 'ko'); }

    // ── 자동 로그아웃 예외 ────────────────────────────────────────────────
    //
    // 홈페이지 auth.js 는 15분 무활동 시 로그아웃한다. 메신저 탭을 열어두면
    // 수신이 끊기므로 이 페이지에서만 예외를 둔다.
    //
    // auth.js 는 수정하지 않는다. resetAutoLogoutTimer() 가 최상위 함수라
    // 전역으로 접근되고, 이걸 주기 호출하면 ①이 탭의 경고·로그아웃 타이머가 리셋되고
    // ②공유 localStorage.lastActivityTime 이 갱신되어 다른 탭의 autoLogout() 이
    // 스스로 취소된다(auth.js 의 기존 다중탭 보호 로직).
    //
    // ⚠️ Firebase Auth 세션은 탭이 아니라 브라우저 단위라, 이 하트비트가 도는 동안은
    //    로그인 세션 전체가 유지된다. 그래서 완전히 방치된 PC까지 살려두지 않도록
    //    실제 입력이 60분간 없으면 하트비트를 멈춘다 → 원래 정책으로 복귀.
    var KEEPALIVE_INTERVAL = 3 * 60 * 1000;
    var KEEPALIVE_MAX_IDLE = 60 * 60 * 1000;
    var lastInputAt = Date.now();

    function setupKeepAlive() {
        ['mousedown', 'keydown', 'touchstart', 'wheel'].forEach(function (ev) {
            document.addEventListener(ev, function () { lastInputAt = Date.now(); }, { passive: true });
        });

        setInterval(function () {
            if (Date.now() - lastInputAt > KEEPALIVE_MAX_IDLE) return;   // 방치 → 예외 해제
            if (typeof window.resetAutoLogoutTimer === 'function') {
                try { window.resetAutoLogoutTimer(); } catch (e) { /* 무시 */ }
            }
        }, KEEPALIVE_INTERVAL);
    }

    // ── 접근 제어 ─────────────────────────────────────────────────────────
    //
    // window.checkStaffAccess 는 staff 전용이 아니라 auth.js 의 범용 페이지 게이트
    // 훅이다(auth.js 6곳에서 호출). 메신저도 같은 훅에 자기 판정을 등록한다.
    window.checkStaffAccess = function (user, userData) {
        if (accessGranted) return;

        if (!user || !userData) {
            // 로그인 복원 실패·로그아웃. 홈으로 돌려보낸다(signOut은 부르지 않는다).
            showGate('로그인이 필요합니다. 홈으로 이동합니다…');
            setTimeout(function () { window.location.href = '../../index.html'; }, 800);
            return;
        }

        if (userData.status && userData.status !== 'approved') {
            showGate('가입 승인 대기 중입니다. 관리자 승인 후 이용할 수 있습니다.');
            return;
        }

        accessGranted = true;
        meUid = user.uid;
        meData = userData;

        hideGate();
        renderMe();
        setupKeepAlive();
        startOrgChart();
        withDb(setupPresence, function () { /* 접속 표시는 없어도 대화에 지장 없다 */ });
        withDb(setupPush, function () { /* 푸시는 부가 기능 */ });

        // 📌 개인 설정(고정·음소거·숨김·폴더) — **앱과 공유하는 문서**. 목록보다 먼저 걸어 둔다.
        withDb(listenMyPrefs, function () { /* 없어도 목록은 보인다 */ });

        // 대화 목록은 거래처 계정도 볼 수 있다 (규칙: 참여자면 list 허용).
        withDb(listenRooms, function () {
            var box = byId('msg-rooms');
            if (box) box.innerHTML = '<div class="msg-empty">대화 목록을 불러오지 못했습니다.</div>';
        });
    };

    function showGate(msg) {
        var gate = byId('msg-gate');
        if (!gate) return;
        gate.textContent = msg;
        gate.hidden = false;
    }
    function hideGate() {
        var gate = byId('msg-gate');
        if (gate) gate.hidden = true;
    }

    // 무한 "확인 중…" 방지.
    // auth.js 로드 실패, 인증 경로 누락 등으로 checkStaffAccess 가 한 번도 불리지
    // 않으면 오버레이가 영영 안 걷힌다. 12초 뒤에도 그대로면 빠져나갈 길을 준다.
    setTimeout(function () {
        if (accessGranted) return;
        var gate = byId('msg-gate');
        if (!gate || gate.hidden) return;
        gate.innerHTML =
            '<div style="text-align:center;line-height:1.9">' +
                '로그인 상태를 확인하지 못했습니다.<br>' +
                '<button type="button" class="msg-pill" style="margin-top:12px" ' +
                        'onclick="location.reload()">다시 시도</button> ' +
                '<a class="msg-pill" style="margin-top:12px;text-decoration:none;display:inline-block" ' +
                   'href="../../index.html">홈으로</a>' +
            '</div>';
    }, 12000);

    function renderMe() {
        var parts = [];
        if (meData.name) parts.push(meData.name);
        var sub = [meData.org, meData.position].filter(Boolean).join(' · ');
        var el = byId('msg-me');
        if (el) el.textContent = parts.join('') + (sub ? ' (' + sub + ')' : '');
    }

    // ── 조직도 ────────────────────────────────────────────────────────────

    function getDb() {
        if (db) return db;
        if (typeof authDb !== 'undefined' && authDb) db = authDb;      // auth.js 싱글톤
        return db;
    }

    // 세션 캐시로 복원되는 빠른 경로에서는 auth.js 의 Firebase 초기화가 아직
    // 안 끝났을 수 있다(userData 가 sessionStorage 에서 와서 Firestore 를 거치지 않음).
    // 최대 5초까지 200ms 간격으로 기다린다.
    function withDb(onReady, onFail) {
        var tries = 0;
        (function attempt() {
            if (getDb()) { onReady(getDb()); return; }
            if (++tries > 25) { onFail(); return; }
            setTimeout(attempt, 200);
        })();
    }

    function startOrgChart() {
        var isEmployee = meData.userType === 'employee' || meData.isAdmin === true;

        if (!isEmployee) {
            // 거래처 계정. 규칙상 msgProfiles 목록 조회가 거부되므로 쿼리하지 않는다.
            withDb(startPartnerMode, function () {
                renderTreeMessage('담당자 정보를 불러오지 못했습니다.');
            });
            return;
        }

        withDb(loadProfiles, function () {
            renderTreeMessage('데이터베이스 연결을 준비하지 못했습니다.<br>새로고침해 주세요.');
        });
    }

    function loadProfiles(d) {
        // active 단일 조건만 서버에서 거른다. role 필터·정렬은 클라이언트에서 —
        // 30명 규모라 복합 색인을 만들 이유가 없다.
        //
        // get() 이 아니라 실시간 구독인 이유는 접속 표시(lastSeen)다.
        // 한 번만 읽으면 초록 점이 화면을 연 순간에 멈춘다.
        d.collection('msgProfiles').where('active', '==', true)
            .onSnapshot(function (snap) {
                profiles = [];
                snap.forEach(function (doc) {
                    var p = doc.data({ serverTimestamps: 'estimate' }) || {};
                    p.uid = p.uid || doc.id;
                    if (p.role === 'partner') return;      // 조직도에는 임직원만
                    if (p.uid === meUid) return;           // 나 자신은 제외
                    profiles.push(p);
                });
                renderTree();
                renderPeerPresence();
            }, function (err) {
                console.error('[메신저] 조직도 조회 실패:', err);
                if (err && err.code === 'permission-denied') {
                    renderTreeMessage(
                        '조직도를 볼 권한이 없습니다.<br>' +
                        '<small>보안규칙의 msgProfiles 읽기 조건을 확인하세요.</small>'
                    );
                } else {
                    renderTreeMessage('조직도를 불러오지 못했습니다.<br>잠시 후 다시 시도해 주세요.');
                }
            });

        // lastSeen 이 바뀌지 않아도 시간이 흐르면 접속 표시는 꺼져야 한다.
        // 스냅샷만으로는 그 순간이 오지 않으므로 1분마다 다시 계산한다.
        setInterval(function () {
            if (!profiles.length) return;
            renderTree();
            renderPeerPresence();
        }, 60 * 1000);
    }

    function profileOf(uid) {
        for (var i = 0; i < profiles.length; i++) {
            if (profiles[i].uid === uid) return profiles[i];
        }
        return null;
    }

    /** 대화 헤더의 상대 접속 표시 */
    function renderPeerPresence() {
        var el = byId('msg-main-title');
        if (!el || !currentPeerUid) return;
        var p = profileOf(currentPeerUid);
        if (!p) return;
        el.innerHTML = '<span class="msg-dot' + (isOnline(p) ? ' on' : '') + '"></span>' +
                       esc(p.name || el.textContent || '');
    }

    function renderTreeMessage(html) {
        var tree = byId('msg-tree');
        if (tree) tree.innerHTML = '<div class="msg-empty">' + html + '</div>';
    }

    function renderTree() {
        var tree = byId('msg-tree');
        if (!tree) return;

        var q = String((byId('msg-search') || {}).value || '').trim().toLowerCase();
        var list = profiles.filter(function (p) {
            if (!q) return true;
            return [p.name, p.org, p.position].some(function (v) {
                return String(v || '').toLowerCase().indexOf(q) !== -1;
            });
        });

        if (!list.length) {
            renderTreeMessage(q ? '검색 결과가 없습니다.' : '표시할 임직원이 없습니다.');
            return;
        }

        // 부서별 묶기. 부서가 비어 있는 사람은 맨 뒤 '부서 미지정'으로.
        var NO_ORG = '부서 미지정';
        var groups = {};
        list.forEach(function (p) {
            var org = String(p.org || '').trim() || NO_ORG;
            (groups[org] = groups[org] || []).push(p);
        });

        var orgNames = Object.keys(groups).sort(function (a, b) {
            if (a === NO_ORG) return 1;
            if (b === NO_ORG) return -1;
            return ko(a, b);
        });

        var html = orgNames.map(function (org) {
            var members = groups[org].sort(function (a, b) { return ko(a.name, b.name); });
            // 검색 중에는 항상 펼쳐 보여준다 (접혀 있으면 결과가 안 보인다)
            var collapsed = !q && collapsedOrgs[org] ? ' collapsed' : '';

            var rows = members.map(function (p) {
                var sub = [p.org, p.position].filter(Boolean).join(' · ');
                return '' +
                    '<button type="button" class="msg-person' +
                        (p.uid === selectedUid ? ' selected' : '') +
                        (pickedUids[p.uid] ? ' picked' : '') +
                        '" data-uid="' + esc(p.uid) + '">' +
                        '<span class="msg-check">✓</span>' +
                        '<span class="msg-avatar">' + esc(initial(p.name)) + '</span>' +
                        '<span class="msg-person-text">' +
                            '<span class="msg-person-name">' +
                                '<span class="msg-dot' + (isOnline(p) ? ' on' : '') + '"></span>' +
                                esc(p.name || '(이름 없음)') +
                            '</span><br>' +
                            '<span class="msg-person-sub">' + esc(sub) + '</span>' +
                        '</span>' +
                    '</button>';
            }).join('');

            return '' +
                '<div class="msg-group' + collapsed + '" data-org="' + esc(org) + '">' +
                    '<button type="button" class="msg-group-head">' +
                        '<span class="msg-caret">▼</span>' +
                        '<span>' + esc(org) + ' (' + members.length + ')</span>' +
                    '</button>' +
                    '<div class="msg-group-list">' + rows + '</div>' +
                '</div>';
        }).join('');

        // 이제 조직도는 실시간 구독 + 1분 타이머로 자주 다시 그려진다.
        // 위치를 보존하지 않으면 스크롤해 둔 부서가 갑자기 맨 위로 튄다.
        var keep = tree.scrollTop;
        tree.innerHTML = html;
        tree.scrollTop = keep;
    }

    function switchPane(pane) {
        Array.prototype.forEach.call(document.querySelectorAll('.msg-tab'), function (t) {
            t.classList.toggle('active', t.getAttribute('data-pane') === pane);
        });
        // 지역 변수 이름이 방 목록 배열(rooms)과 겹치지 않게 한다
        var roomsPane = byId('msg-pane-rooms');
        var orgPane = byId('msg-pane-org');
        if (roomsPane) roomsPane.classList.toggle('active', pane === 'rooms');
        if (orgPane) orgPane.classList.toggle('active', pane === 'org');
    }

    function selectPerson(uid) {
        var p = null;
        for (var i = 0; i < profiles.length; i++) {
            if (profiles[i].uid === uid) { p = profiles[i]; break; }
        }
        if (!p) return;

        selectedUid = uid;
        renderTree();

        byId('msg-main-title').textContent = p.name || '(이름 없음)';
        byId('msg-main-sub').textContent = [p.org, p.position].filter(Boolean).join(' · ');
        document.body.classList.add('msg-detail');   // 모바일: 대화 화면으로 전환

        openDirectRoom(p);
    }

    // ── 1:1 대화 ──────────────────────────────────────────────────────────
    //
    // 방 ID 규약: 'direct_' + 두 uid 를 **정렬**해 이어 붙인다.
    // iOS·Android·웹이 100% 같아야 같은 방으로 들어간다 (데이터_스키마.md 4절).
    function directRoomId(a, b) {
        return 'direct_' + [a, b].sort().join('_');
    }

    var currentRoomId = null;
    var currentPeerUid = null;
    var currentRoomData = null;      // 열린 방 문서 (messageCount·readCount 실시간)
    var unsubscribeMessages = null;
    var unsubscribeRoomDoc = null;
    var unsubscribeTyping = null;
    var messages = [];
    var replyTarget = null;          // ↩︎ 답장 대상 메시지 (전송하면 비운다)
    var editTarget = null;           // ✏️ 수정 중인 메시지

    /** 초 → "0:46" (앱의 음성 길이 표기와 같은 형식) */
    function durLabel(sec) {
        var t = Math.max(0, Math.round(Number(sec) || 0));
        return Math.floor(t / 60) + ':' + ('0' + (t % 60)).slice(-2);
    }

    /** 답장 인용에 넣을 한 줄 요약 — 앱 replyPreviewOf() 와 같은 규칙 */
    function previewOf(m) {
        if (!m) return '';
        if (m.deleted) return '삭제된 메시지';
        if (m.imageUrl) return '📷 사진';
        if (m.audioUrl) return '🎤 음성 메시지';
        if (m.fileUrl) return '📎 ' + (m.fileName || '파일');
        return String(m.text || '').slice(0, 80);
    }

    function msgById(id) {
        for (var i = 0; i < messages.length; i++) if (messages[i].id === id) return messages[i];
        return null;
    }

    function setChatHeader(title, sub) {
        byId('msg-main-title').textContent = title || '대화';
        byId('msg-main-sub').textContent = sub || '';
    }

    /** 조직도에서 사람을 눌러 여는 경로 — 방이 없으면 만들어야 한다 */
    function openDirectRoom(peer) {
        var d = getDb();
        if (!d) return;

        var roomId = directRoomId(meUid, peer.uid);
        if (currentRoomId === roomId) return;      // 같은 방 재클릭 — 리스너를 다시 붙이지 않는다
        detachRoom();

        currentRoomId = roomId;
        currentPeerUid = peer.uid;
        messages = [];
        renderChatMessage('대화를 불러오는 중…');

        // 메시지 create 규칙이 msgIsMember(roomId) → 방 문서를 먼저 만들어야 한다.
        // 방이 없는 상태에서 메시지를 쓰면 규칙 평가가 거부된다.
        ensureRoom(d, roomId, peer)
            .then(function () {
                if (currentRoomId !== roomId) return;   // 기다리는 사이 다른 방으로 이동
                attachRoom(d, roomId);
            })
            .catch(function (err) {
                console.error('[메신저] 방 준비 실패:', err);
                setComposerEnabled(false);
                renderChatMessage(
                    err && err.code === 'permission-denied'
                        ? '이 대화를 열 권한이 없습니다.'
                        : '대화를 열지 못했습니다. 잠시 후 다시 시도해 주세요.'
                );
            });
    }

    /** 대화 목록에서 여는 경로 — 방이 이미 있으므로 생성 단계를 건너뛴다 */
    function openRoomFromList(room) {
        var d = getDb();
        if (!d) return;
        if (currentRoomId === room.id) return;
        detachRoom();

        currentRoomId = room.id;
        currentPeerUid = otherUidOf(room);
        messages = [];
        renderChatMessage('대화를 불러오는 중…');
        setChatHeader(roomTitle(room), '');
        document.body.classList.add('msg-detail');

        attachRoom(d, room.id);
    }

    function attachRoom(d, roomId) {
        listenMessages(d, roomId);
        listenRoomDoc(d, roomId);
        listenTyping(d, roomId);
        setComposerEnabled(true);
        renderRooms();                 // 선택 표시 갱신
        renderPeerPresence();          // 다음 스냅샷을 기다리지 않고 접속 점을 바로 표시

        var menu = byId('msg-roommenu');
        if (menu) menu.hidden = false;
    }

    function detachRoom() {
        [unsubscribeMessages, unsubscribeRoomDoc, unsubscribeTyping].forEach(function (fn) {
            if (fn) { try { fn(); } catch (e) { /* 무시 */ } }
        });
        unsubscribeMessages = null;
        unsubscribeRoomDoc = null;
        unsubscribeTyping = null;

        stopTypingSignal();            // 나가면서 '작성 중' 흔적을 지운다
        currentRoomId = null;
        currentPeerUid = null;
        currentRoomData = null;
        setComposerEnabled(false);
        showTyping('');

        var menu = byId('msg-roommenu');
        if (menu) menu.hidden = true;
    }

    /**
     * 방 문서를 보장한다.
     * - 없으면 생성 (규칙: 임직원 + participants에 나 포함 + createdBy == 나)
     * - 있는데 내가 참여자에서 빠져 있으면 나만 다시 넣는다 (1:1 재입장 분기)
     * 두 사람이 동시에 열어도 한쪽만 생성되도록 트랜잭션으로 처리한다.
     */
    function ensureRoom(d, roomId, peer) {
        var roomRef = d.collection('msgRooms').doc(roomId);
        var myName = (meData && meData.name) || '';

        return d.runTransaction(function (tx) {
            return tx.get(roomRef).then(function (snap) {
                if (!snap.exists) {
                    var names = {};
                    names[meUid] = myName;
                    names[peer.uid] = peer.name || '';
                    tx.set(roomRef, {
                        participants: [meUid, peer.uid],
                        participantNames: names,
                        roomType: 'direct',
                        createdBy: meUid,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        lastMessage: '',
                        lastMessageTime: firebase.firestore.FieldValue.serverTimestamp(),
                        messageCount: 0,
                        readCount: {}
                    });
                    return;
                }

                var data = snap.data() || {};
                var parts = data.participants || [];
                var patch = {};

                if (parts.indexOf(meUid) === -1) {
                    // 재입장 — 규칙이 participants·participantNames 만 함께 바꾸도록 제한한다.
                    var nextNames = Object.assign({}, data.participantNames || {});
                    nextNames[meUid] = myName;
                    nextNames[peer.uid] = peer.name || '';
                    tx.update(roomRef, {
                        participants: parts.concat([meUid]),
                        participantNames: nextNames
                    });
                    return;
                }

                // 이름이 바뀐 경우만 갱신 (거래처는 프로필을 못 읽어 이 맵으로 상대 이름을 본다)
                var pn = data.participantNames || {};
                if (pn[meUid] !== myName) patch['participantNames.' + meUid] = myName;
                if (peer.name && pn[peer.uid] !== peer.name) patch['participantNames.' + peer.uid] = peer.name;
                if (Object.keys(patch).length) tx.update(roomRef, patch);
            });
        });
    }

    function listenMessages(d, roomId) {
        // 최신 50개만. 과거 더 보기는 이후 단계에서 붙인다.
        unsubscribeMessages = d.collection('msgRooms').doc(roomId)
            .collection('messages')
            .orderBy('timestamp', 'desc')
            .limit(50)
            .onSnapshot(function (snap) {
                if (currentRoomId !== roomId) return;
                messages = snap.docs.map(function (doc) {
                    // 서버 타임스탬프가 확정되기 전(전송 직후)에는 estimate 로 즉시 표시한다.
                    // 기본값(null)이면 방금 보낸 메시지의 시각이 비어 보인다.
                    var m = doc.data({ serverTimestamps: 'estimate' }) || {};
                    m.id = doc.id;
                    m.pending = doc.metadata.hasPendingWrites;
                    return m;
                });
                renderChat();
            }, function (err) {
                console.error('[메신저] 메시지 수신 실패:', err);
                if (currentRoomId !== roomId) return;
                renderChatMessage(
                    err && err.code === 'permission-denied'
                        ? '이 대화를 읽을 권한이 없습니다.'
                        : '메시지를 불러오지 못했습니다.'
                );
            });
    }

    // ── 열린 방 문서 구독 (안읽음·읽음 표시의 근거) ───────────────────────

    function listenRoomDoc(d, roomId) {
        unsubscribeRoomDoc = d.collection('msgRooms').doc(roomId)
            .onSnapshot(function (snap) {
                if (currentRoomId !== roomId) return;
                currentRoomData = snap.exists ? (snap.data() || {}) : null;
                markRead(d, roomId);      // 열어 놓고 있으면 곧바로 읽음 처리
                renderNotice();
                renderChat();             // 상대의 읽음 상태가 바뀌면 표시도 바뀐다
            }, function (err) {
                console.error('[메신저] 방 문서 구독 실패:', err);
            });
    }

    /**
     * 읽음 처리 — readCount[내 uid] 를 messageCount 에 맞춘다.
     * 안읽음 수 = messageCount - readCount[내 uid] (데이터_스키마.md 4절).
     *
     * 이미 같은 값이면 쓰지 않는다. 이 가드가 없으면
     * 쓰기 → 방 문서 변경 → 스냅샷 → 다시 쓰기 로 무한 루프가 된다.
     */
    function markRead(d, roomId) {
        if (!currentRoomData) return;
        var total = currentRoomData.messageCount || 0;
        var mine = (currentRoomData.readCount || {})[meUid] || 0;
        if (mine >= total) return;

        var patch = {};
        patch['readCount.' + meUid] = total;
        d.collection('msgRooms').doc(roomId).update(patch).catch(function (err) {
            console.error('[메신저] 읽음 처리 실패:', err);
        });
    }

    // ── 작성 중 표시 ──────────────────────────────────────────────────────
    //
    // msgRooms/{roomId}/typing/{uid} = { at: 서버시각 }
    // 규칙상 본인 uid 문서에만 쓸 수 있다. 입력할 때마다 쓰면 요금이 새므로
    // 3초에 한 번만 갱신하고, 5초간 갱신이 없으면 표시를 내린다.
    var TYPING_PUSH_INTERVAL = 3000;
    var TYPING_STALE_AFTER = 5000;
    var lastTypingPushAt = 0;
    var typingStopTimer = null;

    function signalTyping() {
        var d = getDb();
        if (!d || !currentRoomId) return;

        var now = Date.now();
        if (now - lastTypingPushAt > TYPING_PUSH_INTERVAL) {
            lastTypingPushAt = now;
            d.collection('msgRooms').doc(currentRoomId).collection('typing').doc(meUid)
                .set({ at: firebase.firestore.FieldValue.serverTimestamp() })
                .catch(function () { /* 표시용이라 실패해도 무시 */ });
        }

        // 입력이 멎으면 흔적을 지운다 (안 지우면 5초 뒤 자동으로 사라지긴 한다)
        if (typingStopTimer) clearTimeout(typingStopTimer);
        typingStopTimer = setTimeout(stopTypingSignal, TYPING_STALE_AFTER);
    }

    function stopTypingSignal() {
        if (typingStopTimer) { clearTimeout(typingStopTimer); typingStopTimer = null; }
        lastTypingPushAt = 0;

        var d = getDb();
        if (!d || !currentRoomId) return;
        d.collection('msgRooms').doc(currentRoomId).collection('typing').doc(meUid)
            .delete().catch(function () { /* 무시 */ });
    }

    function listenTyping(d, roomId) {
        unsubscribeTyping = d.collection('msgRooms').doc(roomId).collection('typing')
            .onSnapshot(function (snap) {
                if (currentRoomId !== roomId) return;

                var names = [];
                var cutoff = Date.now() - TYPING_STALE_AFTER;
                snap.forEach(function (doc) {
                    if (doc.id === meUid) return;
                    var at = toDate((doc.data({ serverTimestamps: 'estimate' }) || {}).at);
                    if (!at || at.getTime() < cutoff) return;   // 탭이 갑자기 닫혀 남은 문서 무시
                    names.push(nameOfUid(doc.id));
                });

                showTyping(names.length
                    ? names.filter(Boolean).join(', ') + ' 님이 입력 중…'
                    : '');
            }, function (err) {
                console.error('[메신저] 작성 중 구독 실패:', err);
            });
    }

    function showTyping(text) {
        var el = byId('msg-typing');
        if (!el) return;
        el.textContent = text;
        el.classList.toggle('on', !!text);
    }

    /** 방 문서의 participantNames 를 우선 본다 — 거래처는 프로필을 못 읽기 때문 */
    function nameOfUid(uid) {
        if (currentRoomData && currentRoomData.participantNames &&
            currentRoomData.participantNames[uid]) {
            return currentRoomData.participantNames[uid];
        }
        for (var i = 0; i < profiles.length; i++) {
            if (profiles[i].uid === uid) return profiles[i].name || '';
        }
        return '상대방';
    }

    // ── 대화 목록 ─────────────────────────────────────────────────────────

    var rooms = [];

    /**
     * 1:1 방의 상대 uid. 그룹은 상대가 하나로 정해지지 않으므로 null 이다.
     * (읽음 표시 '1' 과 접속 점이 이 값에 달려 있어, 그룹에서 아무나 집으면 잘못 표시된다)
     */
    function otherUidOf(room) {
        if (room.roomType === 'group') return null;
        var parts = room.participants || [];
        for (var i = 0; i < parts.length; i++) {
            if (parts[i] !== meUid) return parts[i];
        }
        return null;
    }

    function roomTitle(room) {
        if (room.roomType === 'group') return room.name || '그룹 대화';
        var other = otherUidOf(room);
        return (room.participantNames || {})[other] || '(이름 없음)';
    }

    function unreadOf(room) {
        var total = room.messageCount || 0;
        var read = (room.readCount || {})[meUid] || 0;
        return Math.max(0, total - read);
    }

    // ── 📌 개인 설정 (msgUserPrefs) — **앱과 같은 문서를 공유한다** ───────────
    //   pinnedRooms · mutedRooms · hiddenRooms · roomFolders
    //   여기서 바꾸면 앱에도 즉시 반영되고, 서버 푸시 함수도 mutedRooms 를 존중한다.
    // ────────────────────────────────────────────────────────────────────────
    var myPrefs = { pinnedRooms: [], mutedRooms: [], hiddenRooms: [], roomFolders: [],
                    chatClearedAt: {}, blockedUsers: [] };
    var selectedFolder = '전체';        // 폴더 칩 선택 상태 (전체 · 안읽음 · 사용자 폴더)

    function listenMyPrefs(d) {
        d.collection('msgUserPrefs').doc(meUid).onSnapshot(function (snap) {
            var v = (snap && snap.exists) ? (snap.data() || {}) : {};
            myPrefs = {
                pinnedRooms: v.pinnedRooms || [],
                mutedRooms: v.mutedRooms || [],
                hiddenRooms: v.hiddenRooms || [],
                roomFolders: v.roomFolders || [],
                chatClearedAt: v.chatClearedAt || {},
                blockedUsers: v.blockedUsers || []
            };
            renderChat();          // 초기화 시각이 바뀌면 대화도 다시 그린다
            // 폴더가 지워졌는데 그 칩이 선택돼 있으면 목록이 영영 비어 보인다
            if (selectedFolder !== '전체' && selectedFolder !== '안읽음' &&
                !myPrefs.roomFolders.some(function (f) { return f.name === selectedFolder; })) {
                selectedFolder = '전체';
            }
            renderRooms();
        }, function (err) {
            console.error('[메신저] 개인 설정 구독 실패:', err);
        });
    }

    function prefsRef() {
        var d = getDb();
        return d ? d.collection('msgUserPrefs').doc(meUid) : null;
    }

    /** 배열 필드 토글 (고정·음소거·숨김 공용) */
    function toggleRoomPref(field, roomId, on) {
        var ref = prefsRef();
        if (!ref) return;
        var patch = {};
        patch[field] = on
            ? firebase.firestore.FieldValue.arrayUnion(roomId)
            : firebase.firestore.FieldValue.arrayRemove(roomId);
        ref.set(patch, { merge: true }).catch(function (err) {
            console.error('[메신저] 설정 저장 실패:', err);
        });
    }

    function inArr(arr, v) { return (arr || []).indexOf(v) !== -1; }

    function listenRooms(d) {
        // orderBy 를 붙이면 array-contains 와 묶여 복합 색인이 필요해진다.
        // 방 수십 개 규모라 정렬은 클라이언트에서 한다 — 콘솔에서 색인을 만들 일이 없다.
        d.collection('msgRooms').where('participants', 'array-contains', meUid)
            .onSnapshot(function (snap) {
                rooms = snap.docs.map(function (doc) {
                    var r = doc.data() || {};
                    r.id = doc.id;
                    return r;
                });
                rooms.sort(function (a, b) {
                    var ta = toDate(a.lastMessageTime), tb = toDate(b.lastMessageTime);
                    return (tb ? tb.getTime() : 0) - (ta ? ta.getTime() : 0);
                });
                renderRooms();
            }, function (err) {
                console.error('[메신저] 대화 목록 구독 실패:', err);
                var box = byId('msg-rooms');
                if (box) box.innerHTML = '<div class="msg-empty">대화 목록을 불러오지 못했습니다.</div>';
            });
    }

    function renderRooms() {
        var box = byId('msg-rooms');
        if (!box) return;

        // 숨긴 방은 목록에서 아예 뺀다 (앱과 같은 기준)
        var visible = rooms.filter(function (r) { return !inArr(myPrefs.hiddenRooms, r.id); });

        // 열려 있는 방은 빼고 센다. 읽음 처리가 서버를 한 번 왕복하는 동안
        // 지금 보고 있는 대화 때문에 탭 배지가 깜빡이는 것을 막는다 (아래 행 배지와 같은 기준).
        var totalUnread = 0;
        visible.forEach(function (r) {
            if (r.id !== currentRoomId) totalUnread += unreadOf(r);
        });

        var badge = byId('msg-total-unread');
        if (badge) {
            badge.textContent = totalUnread > 99 ? '99+' : String(totalUnread);
            badge.hidden = totalUnread === 0;
        }

        renderFolderChips(visible);

        // 폴더 칩 필터
        var folder = null;
        if (selectedFolder !== '전체' && selectedFolder !== '안읽음') {
            for (var f = 0; f < myPrefs.roomFolders.length; f++) {
                if (myPrefs.roomFolders[f].name === selectedFolder) {
                    folder = myPrefs.roomFolders[f].rooms || [];
                    break;
                }
            }
        }
        var list = visible.filter(function (r) {
            if (selectedFolder === '안읽음') return unreadOf(r) > 0;
            if (folder) return folder.indexOf(r.id) !== -1;
            return true;
        });

        // 📌 고정한 방을 맨 위로 (그 안에서는 원래 순서 = 최신순)
        list.sort(function (a, b) {
            return (inArr(myPrefs.pinnedRooms, b.id) ? 1 : 0) - (inArr(myPrefs.pinnedRooms, a.id) ? 1 : 0);
        });

        if (!list.length) {
            box.innerHTML = '<div class="msg-empty">' +
                (selectedFolder === '안읽음' ? '안 읽은 대화가 없습니다.'
                 : folder ? '이 폴더에 담긴 대화가 없습니다.<br>대화를 우클릭해 폴더에 담을 수 있어요.'
                 : '아직 대화가 없습니다.<br>조직도 탭에서 상대를 선택해 시작하세요.') +
                '</div>';
            return;
        }

        box.innerHTML = list.map(function (r) {
            // 열려 있는 방의 배지는 0으로 보여준다. readCount 갱신이 서버를 한 번
            // 왕복하는 동안 자기 방 배지가 잠깐 켜지는 게 보이기 때문.
            var unread = (r.id === currentRoomId) ? 0 : unreadOf(r);
            var dt = toDate(r.lastMessageTime);
            var pinned = inArr(myPrefs.pinnedRooms, r.id);
            var muted = inArr(myPrefs.mutedRooms, r.id);
            return '' +
                '<button type="button" class="msg-room' +
                    (r.id === currentRoomId ? ' selected' : '') +
                    '" data-room="' + esc(r.id) + '">' +
                    '<span class="msg-avatar">' + esc(initial(roomTitle(r))) + '</span>' +
                    '<span class="msg-room-text">' +
                        '<span class="msg-room-top">' +
                            '<span class="msg-room-name">' +
                                (pinned ? '<span class="msg-room-mark" title="상단 고정">📌</span>' : '') +
                                (muted ? '<span class="msg-room-mark" title="알림 꺼짐">🔕</span>' : '') +
                                esc(roomTitle(r)) +
                            '</span>' +
                            '<span class="msg-room-time">' + esc(dt ? hhmm(dt) : '') + '</span>' +
                        '</span>' +
                        '<span class="msg-room-last">' + esc(r.lastMessage || '') + '</span>' +
                    '</span>' +
                    (unread ? '<span class="msg-unread">' + (unread > 99 ? '99+' : unread) + '</span>' : '') +
                '</button>';
        }).join('');
    }

    /** 📁 폴더 칩 — (전체)(안읽음)(사용자 폴더…)(+). 앱의 채팅 탭과 같은 구성 */
    function renderFolderChips(visible) {
        var bar = byId('msg-folders');
        if (!bar) return;
        var names = ['전체', '안읽음'].concat(myPrefs.roomFolders.map(function (f) { return f.name; }));
        bar.innerHTML = names.map(function (name) {
            var count = 0;
            if (name === '안읽음') {
                visible.forEach(function (r) { count += unreadOf(r); });
            } else if (name !== '전체') {
                var ids = [];
                myPrefs.roomFolders.forEach(function (f) { if (f.name === name) ids = f.rooms || []; });
                visible.forEach(function (r) { if (ids.indexOf(r.id) !== -1) count += unreadOf(r); });
            }
            return '<button type="button" class="msg-chip' + (selectedFolder === name ? ' on' : '') +
                       '" data-folder="' + esc(name) + '">' + esc(name) +
                       (count ? '<span class="msg-chip-badge">' + (count > 99 ? '99+' : count) + '</span>' : '') +
                   '</button>';
        }).join('') +
        '<button type="button" class="msg-chip msg-chip-add" id="msg-folder-add" title="폴더 만들기">+</button>';
    }

    /** 폴더 만들기 — 이름만 받고, 방은 목록에서 우클릭해 담는다 */
    function createFolder() {
        var name = (prompt('새 폴더 이름을 입력하세요') || '').trim();
        if (!name) return;
        if (name === '전체' || name === '안읽음') { alert('그 이름은 쓸 수 없습니다.'); return; }
        if (myPrefs.roomFolders.some(function (f) { return f.name === name; })) {
            alert('같은 이름의 폴더가 이미 있습니다.');
            return;
        }
        var next = myPrefs.roomFolders.concat([{ name: name, rooms: [] }]);
        var ref = prefsRef();
        if (ref) ref.set({ roomFolders: next }, { merge: true }).catch(function (err) {
            console.error('[메신저] 폴더 생성 실패:', err);
        });
    }

    /** 방을 폴더에 담기/빼기 (한 방은 여러 폴더에 담길 수 있다 — 앱과 같은 규칙) */
    function toggleRoomInFolder(roomId, folderName) {
        var next = myPrefs.roomFolders.map(function (f) {
            if (f.name !== folderName) return f;
            var ids = (f.rooms || []).slice();
            var i = ids.indexOf(roomId);
            if (i >= 0) ids.splice(i, 1); else ids.push(roomId);
            return { name: f.name, rooms: ids };
        });
        var ref = prefsRef();
        if (ref) ref.set({ roomFolders: next }, { merge: true }).catch(function (err) {
            console.error('[메신저] 폴더 담기 실패:', err);
        });
    }

    function deleteFolder(name) {
        var next = myPrefs.roomFolders.filter(function (f) { return f.name !== name; });
        var ref = prefsRef();
        if (ref) ref.set({ roomFolders: next }, { merge: true });
        if (selectedFolder === name) selectedFolder = '전체';
    }

    /** 방 우클릭 메뉴 — 고정 · 알림 · 폴더 · 숨기기 (앱의 길게 누르기와 같은 항목) */
    function openRoomMenu(roomId, x, y) {
        closeMsgMenu();
        var pinned = inArr(myPrefs.pinnedRooms, roomId);
        var muted = inArr(myPrefs.mutedRooms, roomId);

        var items =
            '<button type="button" class="msg-menu-item" data-act="pin">' +
                (pinned ? '고정 해제' : '상단 고정') + '</button>' +
            '<button type="button" class="msg-menu-item" data-act="mute">' +
                (muted ? '알림 켜기' : '알림 끄기') + '</button>';
        myPrefs.roomFolders.forEach(function (f) {
            var has = (f.rooms || []).indexOf(roomId) !== -1;
            items += '<button type="button" class="msg-menu-item" data-act="folder" ' +
                         'data-folder="' + esc(f.name) + '">' +
                         (has ? '☑ ' : '☐ ') + esc(f.name) + '</button>';
        });
        items += '<button type="button" class="msg-menu-item danger" data-act="hide">목록에서 숨기기</button>';

        var menu = document.createElement('div');
        menu.className = 'msg-menu';
        menu.id = 'msg-msg-menu';
        menu.setAttribute('data-room-id', roomId);
        menu.innerHTML = items;
        document.body.appendChild(menu);
        var left = Math.min(Math.max(8, x), window.innerWidth - menu.offsetWidth - 8);
        var top = Math.min(Math.max(8, y), window.innerHeight - menu.offsetHeight - 8);
        menu.style.left = left + 'px';
        menu.style.top = top + 'px';
    }

    // ── 대화 렌더 ─────────────────────────────────────────────────────────

    function renderChatMessage(text) {
        var chat = byId('msg-chat');
        if (chat) chat.innerHTML = '<div class="msg-chat-empty">' + esc(text) + '</div>';
    }

    function toDate(v) {
        if (!v) return null;
        if (typeof v.toDate === 'function') return v.toDate();
        return null;
    }

    function hhmm(dt) {
        if (!dt) return '';
        var h = dt.getHours(), m = dt.getMinutes();
        var ampm = h < 12 ? '오전' : '오후';
        var h12 = h % 12; if (h12 === 0) h12 = 12;
        return ampm + ' ' + h12 + ':' + (m < 10 ? '0' + m : m);
    }

    function dayKey(dt) {
        return dt ? dt.getFullYear() + '-' + (dt.getMonth() + 1) + '-' + dt.getDate() : '';
    }

    function dayLabel(dt) {
        if (!dt) return '';
        var W = ['일', '월', '화', '수', '목', '금', '토'];
        return dt.getFullYear() + '년 ' + (dt.getMonth() + 1) + '월 ' + dt.getDate() + '일 (' +
               W[dt.getDay()] + ')';
    }

    function renderChat() {
        var chat = byId('msg-chat');
        if (!chat) return;

        if (!messages.length) {
            renderChatMessage('아직 대화가 없습니다. 첫 메시지를 보내보세요.');
            return;
        }

        // 상대가 아직 안 읽은 개수. 최신 쪽부터 그 개수만큼이 미열람이다.
        //
        // ⚠️ 근사치다. messageCount 는 하드 삭제된 문서까지 세므로 화면의 메시지 개수와
        //    어긋날 수 있다(데이터_스키마.md 4절 경고). 정확한 메시지별 판정을 하려면
        //    메시지에 순번 필드가 필요한데, 스키마에 없는 필드를 늘리지 않았다.
        var peerUnread = 0;
        if (currentRoomData && currentPeerUid) {
            peerUnread = Math.max(0,
                (currentRoomData.messageCount || 0) -
                ((currentRoomData.readCount || {})[currentPeerUid] || 0));
        }

        // messages 는 최신 → 과거 순(desc). 컨테이너가 column-reverse 라
        // DOM 첫 자식이 화면 맨 아래에 온다. 즉 이 순서 그대로 넣으면 된다.
        var clearedAt = clearedAtOf(currentRoomId);
        var html = '';
        for (var i = 0; i < messages.length; i++) {
            var m = messages[i];
            // 🔎 검색 중이면 본문·파일명이 걸리는 메시지만 남긴다
            if (chatQuery) {
                var hay = ((m.text || '') + ' ' + (m.fileName || '')).toLowerCase();
                if (hay.indexOf(chatQuery) === -1) continue;
            }
            // 🧹 "대화내용 초기화" 이전 메시지는 내 화면에서만 감춘다
            if (clearedAt) {
                var mt = toDate(m.timestamp);
                if (mt && mt.getTime() <= clearedAt) continue;
            }
            var mine = m.senderId === meUid;
            var dt = toDate(m.timestamp);
            var unseen = mine && i < peerUnread && !m.pending;

            // ↩︎ 답장 인용 — 앱이 보낼 때 replyToSender/replyToText 스냅샷을 함께 저장한다.
            //    (iOS·안드로이드 공유 규약. replyToPreview 는 초기 안드로이드 데이터 폴백)
            var quote = '';
            if (!m.deleted && (m.replyToSender || m.replyToText || m.replyToPreview)) {
                quote = '<div class="msg-quote">' +
                            '<span class="msg-quote-name">' + esc(m.replyToSender || '') + '</span>' +
                            esc(m.replyToText || m.replyToPreview || '') +
                        '</div>';
            }

            var bubble;
            if (m.deleted) {
                bubble = '<div class="msg-bubble deleted">삭제된 메시지입니다</div>';
            } else if (safeUrl(m.audioUrl)) {
                // 🎤 음성 메시지 — 앱에서 보낸 것. 없으면 웹에서 빈 말풍선으로 보인다.
                bubble = '<div class="msg-bubble">' + quote +
                            '<audio class="msg-audio" controls preload="none" ' +
                                   'src="' + esc(safeUrl(m.audioUrl)) + '"></audio>' +
                            (m.audioDuration
                                ? '<div class="msg-audio-dur">' + esc(durLabel(m.audioDuration)) + '</div>'
                                : '') +
                         '</div>';
            } else if (safeUrl(m.imageUrl)) {
                // loading="lazy": 과거를 거슬러 올라갈 때 화면 밖 이미지를 미리 받지 않는다
                bubble = '<div class="msg-bubble media">' + quote +
                            '<img class="msg-image" loading="lazy" alt="사진" ' +
                                 'src="' + esc(safeUrl(m.imageUrl)) + '" ' +
                                 'data-full="' + esc(safeUrl(m.imageUrl)) + '">' +
                         '</div>';
            } else if (safeUrl(m.fileUrl)) {
                bubble = '<div class="msg-bubble">' + quote +
                            '<a class="msg-file" href="' + esc(safeUrl(m.fileUrl)) + '" ' +
                               'target="_blank" rel="noopener noreferrer" download>' +
                                '<span class="msg-file-ico">📄</span>' +
                                '<span>' +
                                    '<span class="msg-file-name">' + esc(m.fileName || '첨부파일') + '</span><br>' +
                                    '<span class="msg-file-size">' + esc(humanSize(m.fileSize)) + '</span>' +
                                '</span>' +
                         '</a></div>';
            } else {
                bubble = '<div class="msg-bubble">' + quote + esc(m.text || '') + '</div>';
            }

            // 🙂 이모지 반응 — reactions: { 이모지: [uid…] }. 내가 누른 것은 표시를 달리한다.
            var reactHtml = '';
            if (!m.deleted && m.reactions) {
                var keys = Object.keys(m.reactions);
                var chips = '';
                for (var r = 0; r < keys.length; r++) {
                    var users = m.reactions[keys[r]] || [];
                    if (!users.length) continue;
                    var isMine = users.indexOf(meUid) !== -1;
                    chips += '<button type="button" class="msg-react' + (isMine ? ' on' : '') + '" ' +
                                 'data-react-msg="' + esc(m.id) + '" data-react-emoji="' + esc(keys[r]) + '">' +
                                 esc(keys[r]) + ' ' + users.length +
                             '</button>';
                }
                if (chips) reactHtml = '<div class="msg-reactions">' + chips + '</div>';
            }
            if (reactHtml) bubble += reactHtml;

            html += '<div class="msg-row' + (mine ? ' mine' : '') + '" data-msg-id="' + esc(m.id) + '">' +
                        bubble +
                        (unseen ? '<span class="msg-unseen">1</span>' : '') +
                        (m.edited && !m.deleted ? '<span class="msg-edited">수정됨</span>' : '') +
                        '<span class="msg-time">' +
                            (m.pending ? '전송 중…' : esc(hhmm(dt))) +
                        '</span>' +
                    '</div>';

            // 상대가 연속으로 보낸 묶음의 맨 위에만 이름을 붙인다.
            // (DOM 다음 항목 = 더 과거 = 화면 위쪽)
            var older = messages[i + 1];
            if (!mine && (!older || older.senderId !== m.senderId)) {
                html += '<div class="msg-sender">' + esc(m.senderName || '') + '</div>';
            }

            // 날짜 구분선은 그 날의 **가장 오래된** 메시지 위(=DOM 뒤)에 온다.
            if (dt && (!older || dayKey(toDate(older.timestamp)) !== dayKey(dt))) {
                html += '<div class="msg-daysep">' + esc(dayLabel(dt)) + '</div>';
            }
        }

        // 스냅샷마다 목록을 통째로 다시 그리므로 브라우저의 스크롤 앵커가 통하지 않는다.
        // 위치를 저장·복원하지 않으면 과거를 읽는 중에 새 메시지가 올 때 바닥으로 튕긴다.
        // column-reverse 에서 바닥은 오프셋 0 이라, 바닥에 있었다면 복원해도 그대로 바닥이다.
        var keep = chat.scrollTop;
        chat.innerHTML = html;
        chat.scrollTop = keep;
        // 그 외에는 스크롤을 만지지 않는다 — "바닥으로 보내는" 장치를 덧대지 말 것.
    }

    // ── 메시지 조작 (답장 · 반응 · 수정 · 삭제) ────────────────────────────
    //
    // 앱(안드로이드)과 **같은 필드·같은 규칙**을 쓴다. 한쪽만 다르면 크로스에서 어긋난다:
    //   답장: replyToId · replyToSender · replyToText
    //   반응: reactions.{이모지} 배열에 uid
    //   수정: text · edited (24시간 이내, 본인만 — 보안규칙이 서버에서도 막는다)
    //   삭제: deleted=true 로 두고 문서는 남긴다(카톡식 tombstone)
    // ────────────────────────────────────────────────────────────────────────

    var EDIT_WINDOW_MS = 24 * 60 * 60 * 1000;   // 규칙의 duration.value(24,'h') 와 같은 값
    var REACTION_EMOJIS = ['👍', '❤️', '😂', '😮', '😢', '🙏'];

    /** 답장 배너 표시/해제 */
    function setReplyTarget(m) {
        replyTarget = m || null;
        var bar = byId('msg-reply-bar');
        if (!bar) return;
        if (!replyTarget) { bar.hidden = true; return; }
        bar.hidden = false;
        byId('msg-reply-name').textContent = replyTarget.senderId === meUid
            ? '나' : (replyTarget.senderName || '상대');
        byId('msg-reply-text').textContent = previewOf(replyTarget);
    }

    /** 수정 모드 — 입력창에 원문을 넣고 전송 버튼이 '수정 저장'으로 동작한다 */
    function setEditTarget(m) {
        editTarget = m || null;
        var input = byId('msg-input');
        var bar = byId('msg-edit-bar');
        if (bar) bar.hidden = !editTarget;
        if (editTarget && input) {
            setReplyTarget(null);           // 답장과 수정은 동시에 성립하지 않는다
            input.value = editTarget.text || '';
            input.focus();
            autoGrow();
        } else if (input) {
            input.value = '';
            autoGrow();
        }
    }

    function saveEdit() {
        var d = getDb();
        var input = byId('msg-input');
        if (!d || !editTarget || !input) return;
        var next = input.value.trim();
        if (!next) return;
        var target = editTarget;
        var roomRef = d.collection('msgRooms').doc(currentRoomId);
        var isLast = messages.length && messages[0].id === target.id;   // messages 는 최신순
        var batch = d.batch();
        batch.update(roomRef.collection('messages').doc(target.id), { text: next, edited: true });
        // 마지막 메시지를 고쳤으면 목록 미리보기도 함께 — 안 하면 옛 글이 목록에 남는다.
        // lastMessageTime 은 건드리지 않는다(수정만으로 방이 위로 올라가면 안 된다).
        if (isLast) batch.set(roomRef, { lastMessage: next }, { merge: true });
        batch.commit().then(function () {
            setEditTarget(null);
        }).catch(function (err) {
            console.error('[메신저] 메시지 수정 실패:', err);
            alert('수정하지 못했습니다. 보낸 지 24시간이 지났을 수 있어요.');
        });
    }

    /** 🙂 반응 토글 — 이미 누른 이모지를 다시 누르면 취소 */
    function toggleReaction(msgId, emoji) {
        var d = getDb();
        if (!d || !currentRoomId) return;
        var m = msgById(msgId);
        var mine = m && m.reactions && (m.reactions[emoji] || []).indexOf(meUid) !== -1;
        var ref = d.collection('msgRooms').doc(currentRoomId).collection('messages').doc(msgId);
        var val = mine
            ? firebase.firestore.FieldValue.arrayRemove(meUid)
            : firebase.firestore.FieldValue.arrayUnion(meUid);
        var patch = {};
        patch['reactions.' + emoji] = val;
        ref.update(patch).catch(function (err) {
            console.error('[메신저] 반응 실패:', err);
        });
    }

    /** 🗑 모두에게서 삭제 — 문서를 지우지 않고 deleted 로 표시(상대 화면에 자리를 남긴다) */
    function deleteMessage(msgId) {
        var d = getDb();
        if (!d || !currentRoomId) return;
        var roomRef = d.collection('msgRooms').doc(currentRoomId);
        var isLast = messages.length && messages[0].id === msgId;
        var batch = d.batch();
        batch.update(roomRef.collection('messages').doc(msgId), { deleted: true });
        if (isLast) batch.set(roomRef, { lastMessage: '삭제된 메시지입니다' }, { merge: true });
        batch.commit().catch(function (err) {
            console.error('[메신저] 메시지 삭제 실패:', err);
            alert('삭제하지 못했습니다. 보낸 지 24시간이 지났을 수 있어요.');
        });
    }

    /** 말풍선 메뉴 — 권한·시간 제한에 맞는 항목만 만든다 */
    function openMsgMenu(msgId, x, y) {
        var m = msgById(msgId);
        if (!m || m.pending) return;
        closeMsgMenu();

        var mine = m.senderId === meUid;
        var isText = !m.imageUrl && !m.fileUrl && !m.audioUrl && !m.deleted;
        var sentAt = toDate(m.timestamp);
        var fresh = sentAt ? (Date.now() - sentAt.getTime() < EDIT_WINDOW_MS) : false;

        var items = '';
        // 반응 줄 (삭제된 메시지에는 달지 않는다)
        if (!m.deleted) {
            var row = '';
            for (var i = 0; i < REACTION_EMOJIS.length; i++) {
                row += '<button type="button" class="msg-menu-emoji" data-emoji="' +
                       esc(REACTION_EMOJIS[i]) + '">' + esc(REACTION_EMOJIS[i]) + '</button>';
            }
            items += '<div class="msg-menu-emojis">' + row + '</div>';
        }
        if (!m.deleted) items += '<button type="button" class="msg-menu-item" data-act="reply">답장</button>';
        if (isText) items += '<button type="button" class="msg-menu-item" data-act="copy">복사</button>';
        if (isText) items += '<button type="button" class="msg-menu-item" data-act="notice">공지로 등록</button>';
        if (mine && isText && fresh && !m.deleted)
            items += '<button type="button" class="msg-menu-item" data-act="edit">수정</button>';
        if (mine && fresh && !m.deleted)
            items += '<button type="button" class="msg-menu-item danger" data-act="delete">삭제</button>';

        var menu = document.createElement('div');
        menu.className = 'msg-menu';
        menu.id = 'msg-msg-menu';
        menu.setAttribute('data-msg-id', msgId);
        menu.innerHTML = items;
        document.body.appendChild(menu);

        // 화면 밖으로 나가지 않게 보정
        var w = menu.offsetWidth, h = menu.offsetHeight;
        var left = Math.min(Math.max(8, x), window.innerWidth - w - 8);
        var top = Math.min(Math.max(8, y), window.innerHeight - h - 8);
        menu.style.left = left + 'px';
        menu.style.top = top + 'px';
    }

    function closeMsgMenu() {
        var el = byId('msg-msg-menu');
        if (el && el.parentNode) el.parentNode.removeChild(el);
    }

    // ── 대화방 관리 (이름 변경 · 대화내용 초기화) ──────────────────────────

    /** 그룹방 이름 변경 — 참여자면 누구나(규칙). 모두에게 바뀐다 */
    function renameRoom() {
        var d = getDb();
        if (!d || !currentRoomId || !currentRoomData) return;
        var next = (prompt('채팅방 이름', currentRoomData.name || '') || '').trim();
        if (!next) return;
        d.collection('msgRooms').doc(currentRoomId).update({ name: next.slice(0, 30) })
            .then(function () { byId('msg-room-modal').hidden = true; })
            .catch(function (err) {
                console.error('[메신저] 이름 변경 실패:', err);
                alert('이름을 바꾸지 못했습니다.');
            });
    }

    /**
     * 🧹 대화내용 초기화 — **내 화면에서만** 지운다(서버 데이터·상대 화면은 그대로).
     * msgUserPrefs.chatClearedAt.{roomId} 에 시각을 남기고, 그보다 오래된 메시지를 렌더에서 뺀다.
     * 앱과 같은 필드·같은 의미라 한쪽에서 지우면 다른 쪽에도 적용된다.
     */
    function clearChatHistory() {
        var ref = prefsRef();
        if (!ref || !currentRoomId) return;
        if (!confirm('이 방의 이전 대화가 내 화면에서만 지워집니다.\n상대방 화면과 서버 기록은 유지됩니다.')) return;
        var patch = {};
        patch['chatClearedAt.' + currentRoomId] = firebase.firestore.FieldValue.serverTimestamp();
        ref.set(patch, { merge: true }).then(function () {
            byId('msg-room-modal').hidden = true;
        }).catch(function (err) {
            console.error('[메신저] 대화 초기화 실패:', err);
        });
    }

    /** 초기화 시각 이전 메시지인지 — renderChat 이 이 값으로 거른다 */
    function clearedAtOf(roomId) {
        var map = myPrefs.chatClearedAt || {};
        var v = map[roomId];
        var dt = v && v.toDate ? v.toDate() : null;
        return dt ? dt.getTime() : 0;
    }

    // ── 🚫 차단 목록 · 📱 로그인된 기기 (앱 설정과 같은 데이터) ──────────────

    /** 차단 목록 — msgUserPrefs.blockedUsers (앱과 공유). 이름은 조직도에서 찾는다 */
    function openBlockedModal() {
        var list = myPrefs.blockedUsers || [];
        if (!list.length) {
            openTextModal('차단 목록', '차단한 사용자가 없습니다.');
            return;
        }
        var lines = list.map(function (uid) {
            var p = profileOf(uid);
            return '· ' + (p ? ((p.position ? p.position + ' ' : '') + p.name) : uid);
        });
        lines.push('');
        lines.push('차단 해제는 앱(설정 → 차단 목록)에서 할 수 있어요.');
        openTextModal('차단 목록', lines.join('\n'));
    }

    /**
     * 로그인된 기기 — msgDevices/{uid}/devices. 읽기는 본인만 가능(규칙).
     * 등록·해제는 서버 함수만 할 수 있어 웹에서는 **보기 전용**이다.
     */
    function openDevicesModal() {
        var d = getDb();
        if (!d) return;
        d.collection('msgDevices').doc(meUid).collection('devices').get().then(function (snap) {
            var lines = [];
            snap.forEach(function (doc) {
                var v = doc.data() || {};
                if (v.revokedAt) return;                       // 밀려난 기기는 빼고 보여준다
                var kind = v.kind === 'tablet' ? '태블릿' : (v.kind === 'desktop' ? 'PC' : '휴대폰');
                var seen = v.lastSeenAt && v.lastSeenAt.toDate
                    ? v.lastSeenAt.toDate().toLocaleString('ko-KR') : '';
                lines.push('· ' + kind + ' — ' + (v.model || '이름 없는 기기') + (seen ? '  (' + seen + ')' : ''));
            });
            if (!lines.length) lines.push('등록된 기기가 없습니다.');
            lines.push('');
            lines.push('기기 해제는 앱(설정 → 로그인된 기기)에서 할 수 있어요.');
            openTextModal('로그인된 기기', lines.join('\n'));
        }).catch(function (err) {
            console.error('[메신저] 기기 목록 조회 실패:', err);
            openTextModal('로그인된 기기', '기기 목록을 불러오지 못했습니다.');
        });
    }

    // ── 🎤 음성 메시지 (MediaRecorder) ──────────────────────────────────────
    //   앱과 같은 필드(audioUrl · audioDuration)·같은 Storage 경로를 쓴다.
    //   브라우저는 webm/opus 를 주로 내놓는다 — 앱은 URL 로 재생하므로 형식이 달라도 무방하다.

    var mediaRecorder = null, recChunks = [], recStartAt = 0, recTimer = null;
    var REC_MAX_MS = 5 * 60 * 1000;      // 앱과 같은 5분 상한

    function startVoiceRecording() {
        if (!navigator.mediaDevices || !window.MediaRecorder) {
            alert('이 브라우저는 녹음을 지원하지 않습니다.');
            return;
        }
        navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
            recChunks = [];
            mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.ondataavailable = function (e) {
                if (e.data && e.data.size) recChunks.push(e.data);
            };
            mediaRecorder.onstop = function () {
                stream.getTracks().forEach(function (t) { t.stop(); });   // 마이크 표시등을 끈다
            };
            mediaRecorder.start();
            recStartAt = Date.now();
            byId('msg-rec-bar').hidden = false;
            recTimer = setInterval(function () {
                var ms = Date.now() - recStartAt;
                byId('msg-rec-time').textContent = durLabel(ms / 1000);
                if (ms >= REC_MAX_MS) stopVoiceRecording(true);
            }, 200);
        }).catch(function (err) {
            console.error('[메신저] 마이크 사용 불가:', err);
            alert('마이크를 사용할 수 없습니다. 브라우저 권한을 확인해 주세요.');
        });
    }

    /** @param send true면 업로드까지, false면 버린다 */
    function stopVoiceRecording(send) {
        if (!mediaRecorder) return;
        var seconds = (Date.now() - recStartAt) / 1000;
        clearInterval(recTimer); recTimer = null;
        byId('msg-rec-bar').hidden = true;

        mediaRecorder.addEventListener('stop', function () {
            if (!send || !recChunks.length) { recChunks = []; return; }
            var blob = new Blob(recChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
            recChunks = [];
            uploadVoice(blob, seconds);
        }, { once: true });
        if (mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        mediaRecorder = null;
    }

    function uploadVoice(blob, seconds) {
        var d = getDb();
        if (!d || !currentRoomId) return;
        var ext = /ogg/.test(blob.type) ? 'ogg' : 'webm';
        var path = 'messenger/chat-media/' + meUid + '/voice-' + Date.now() + '.' + ext;
        var ref = firebase.storage().ref().child(path);
        showUpload('음성 메시지');
        ref.put(blob, { contentType: blob.type, cacheControl: 'private, max-age=31536000' })
            .then(function (snap) { return snap.ref.getDownloadURL(); })
            .then(function (url) {
                var roomRef = d.collection('msgRooms').doc(currentRoomId);
                var batch = d.batch();
                batch.set(roomRef.collection('messages').doc(), {
                    senderId: meUid,
                    senderName: (meData && meData.name) || '',
                    text: '',
                    audioUrl: url,
                    audioDuration: Math.round(seconds),
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                batch.update(roomRef, {
                    lastMessage: '🎤 음성 메시지',
                    lastMessageTime: firebase.firestore.FieldValue.serverTimestamp(),
                    messageCount: firebase.firestore.FieldValue.increment(1)
                });
                return batch.commit();
            })
            .then(function () { byId('msg-upload').classList.remove('on'); })
            .catch(function (err) {
                console.error('[메신저] 음성 전송 실패:', err);
                byId('msg-upload').classList.remove('on');
                alert('음성 메시지를 보내지 못했습니다.');
            });
    }

    // ── 🕒 예약 메시지 ──────────────────────────────────────────────────────
    //   msgRooms/{id}/scheduledMessages 에 넣어 두면 서버가 발송한다.
    //   ⚠️ 발송 함수(deliverScheduledMessages)는 **아직 배포 전**이라 예약만 쌓인다 —
    //      앱도 같은 상태다(등록 UI만 있음). 함수가 올라가면 양쪽 다 즉시 동작한다.

    function scheduleMessage() {
        var d = getDb();
        var input = byId('msg-input');
        if (!d || !currentRoomId || !input) return;
        var text = String(input.value || '').trim();
        if (!text) { alert('예약할 내용을 입력창에 먼저 적어주세요.'); return; }

        var when = prompt('보낼 시각을 입력하세요 (예: 2026-08-16 09:00)');
        if (!when) return;
        var at = new Date(String(when).replace(/-/g, '/'));   // Safari 호환
        if (isNaN(at.getTime())) { alert('시각 형식을 알아볼 수 없습니다.'); return; }
        if (at.getTime() <= Date.now()) { alert('미래 시각만 예약할 수 있습니다.'); return; }

        d.collection('msgRooms').doc(currentRoomId).collection('scheduledMessages').add({
            senderId: meUid,
            senderName: (meData && meData.name) || '',
            text: text,
            sendAt: firebase.firestore.Timestamp.fromDate(at),
            sent: false,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }).then(function () {
            input.value = '';

    /** 프로필 사진 업로드 — 경로·캐시 규약은 앱과 같다 (messenger/profile-photos/{uid}/) */
    function uploadProfilePhoto(file) {
        if (!file) return;
        if (file.size > 5 * 1024 * 1024) { alert('5MB 이하 이미지만 올릴 수 있습니다.'); return; }
        if (!/^image\//.test(file.type) || /svg/i.test(file.type)) {
            alert('이미지 파일만 올릴 수 있습니다. (SVG 제외)');
            return;
        }
        var d = getDb();
        if (!d) return;
        var path = 'messenger/profile-photos/' + meUid + '/avatar_' + Date.now() + '.jpg';
        var ref = firebase.storage().ref().child(path);
        // 파일명이 매번 유일하므로 공용 캐시에 오래 둬도 안전(내용이 바뀌면 새 URL)
        ref.put(file, { contentType: file.type, cacheControl: 'public, max-age=31536000, immutable' })
            .then(function (snap) { return snap.ref.getDownloadURL(); })
            .then(function (url) {
                return d.collection('msgProfiles').doc(meUid).set({ photoUrl: url }, { merge: true });
            })
            .then(function () { alert('프로필 사진을 바꿨어요.'); })
            .catch(function (err) {
                console.error('[메신저] 프로필 사진 실패:', err);
                alert('사진을 올리지 못했습니다.');
            });
    }

    function setComposerEnabled(on) {
        var input = byId('msg-input');
        var send = byId('msg-send');
        var attach = byId('msg-attach');
        if (input) input.disabled = !on;

    var sending = false;
    var pendingRetry = null;     // { roomId, text, id } — 재전송을 멱등하게 만들기 위한 기억

    function sendMessage() {
        var input = byId('msg-input');
        var d = getDb();
        if (!input || !d || !currentRoomId || sending) return;

        // ✏️ 수정 중이면 새 메시지를 보내는 게 아니라 원문을 고친다
        if (editTarget) { saveEdit(); return; }

        var text = String(input.value || '').trim();
        if (!text) return;
        if (text.length > 5000) {           // 규칙도 5,000자를 넘으면 거부한다
            alert('메시지는 5,000자까지 보낼 수 있습니다.');
            return;
        }

        var roomId = currentRoomId;
        var roomRef = d.collection('msgRooms').doc(roomId);

        // 재전송은 **같은 문서 ID** 로 나가야 멱등하다.
        // 서버에는 도달했는데 응답만 실패한 경우, 새 ID로 다시 보내면 메시지가 두 번 남는다.
        // 직전 실패분과 본문이 같으면 그때 쓰려던 ID를 재사용한다.
        var msgRef;
        if (pendingRetry && pendingRetry.roomId === roomId && pendingRetry.text === text) {
            msgRef = roomRef.collection('messages').doc(pendingRetry.id);
        } else {
            msgRef = roomRef.collection('messages').doc();
        }
        pendingRetry = { roomId: roomId, text: text, id: msgRef.id };

        stopTypingSignal();          // 보냈으면 '작성 중' 표시를 즉시 내린다

        // 메시지 추가와 방 요약 갱신을 한 배치로 — 둘이 어긋나면 목록의 마지막 메시지가 틀어진다.
        var batch = d.batch();
        var payload = {
            senderId: meUid,
            senderName: (meData && meData.name) || '',
            text: text,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        };
        // ↩︎ 답장 — 원문이 지워져도 인용이 남도록 **스냅샷**으로 저장한다(앱과 같은 필드명)
        if (replyTarget) {
            payload.replyToId = replyTarget.id;
            payload.replyToSender = replyTarget.senderId === meUid
                ? ((meData && meData.name) || '나') : (replyTarget.senderName || '상대');
            payload.replyToText = previewOf(replyTarget);
        }
        batch.set(msgRef, payload);
        batch.update(roomRef, {
            lastMessage: text.slice(0, 100),
            lastMessageTime: firebase.firestore.FieldValue.serverTimestamp(),
            // 안읽음 수의 기준값. 읽고-더하기를 하면 동시 전송 시 누락되므로 increment 를 쓴다.
            messageCount: firebase.firestore.FieldValue.increment(1)
        });

        sending = true;
        input.value = '';
        setReplyTarget(null);        // 보냈으면 인용 배너를 내린다
        autoGrow(input);

        batch.commit().catch(function (err) {
            console.error('[메신저] 전송 실패:', err);
            input.value = text;             // 날리지 않고 되돌려 준다
            autoGrow(input);
            alert(err && err.code === 'permission-denied'
                ? '메시지를 보낼 권한이 없습니다.'
                : '메시지를 보내지 못했습니다. 다시 시도해 주세요.');
        }).then(function () {
            sending = false;
        });
    }

    function createGroupRoom() {
        var d = getDb();
        if (!d) return;

        var uids = Object.keys(pickedUids);
        if (uids.length < 2) return;

        var name = String(byId('msg-group-name').value || '').trim();
        if (!name) { alert('그룹 이름을 입력해 주세요.'); return; }

        var names = {};
        names[meUid] = (meData && meData.name) || '';
        uids.forEach(function (uid) {
            var p = profileOf(uid);
            names[uid] = p ? (p.name || '') : '';
        });

        var roomRef = d.collection('msgRooms').doc();      // 그룹은 자동 생성 ID
        roomRef.set({
            participants: [meUid].concat(uids),
            participantNames: names,
            name: name,
            roomType: 'group',
            createdBy: meUid,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            lastMessage: '',
            lastMessageTime: firebase.firestore.FieldValue.serverTimestamp(),
            messageCount: 0,
            readCount: {}
        }).then(function () {
            byId('msg-group-modal').hidden = true;
            setPicking(false);
            switchPane('rooms');
            openRoomFromList({
                id: roomRef.id,
                name: name,
                roomType: 'group',
                participants: [meUid].concat(uids),
                participantNames: names
            });
        }).catch(function (err) {
            console.error('[메신저] 그룹 생성 실패:', err);
            alert(err && err.code === 'permission-denied'
                ? '그룹을 만들 권한이 없습니다. (임직원만 가능)'
                : '그룹을 만들지 못했습니다.');
        });
    }

    function inviteToRoom() {
        var d = getDb();
        var uids = Object.keys(pickedUids);
        if (!d || !currentRoomId || !currentRoomData || !uids.length) return;

        var parts = (currentRoomData.participants || []).slice();
        var names = Object.assign({}, currentRoomData.participantNames || {});
        var added = 0;

        uids.forEach(function (uid) {
            if (parts.indexOf(uid) !== -1) return;      // 이미 참여자
            parts.push(uid);
            var p = profileOf(uid);
            names[uid] = p ? (p.name || '') : '';
            added++;
        });

        if (!added) { setPicking(false); return; }

        d.collection('msgRooms').doc(currentRoomId)
            .update({ participants: parts, participantNames: names })
            .then(function () { setPicking(false); })
            .catch(function (err) {
                console.error('[메신저] 초대 실패:', err);
                alert(err && err.code === 'permission-denied'
                    ? '참여자를 추가할 권한이 없습니다. (임직원만 가능)'
                    : '초대하지 못했습니다.');
            });
    }

    // ── 대화방 정보 모달 ──────────────────────────────────────────────────

    function openRoomModal() {
        if (!currentRoomData) return;
        var isEmployee = meData.userType === 'employee' || meData.isAdmin === true;
        var parts = currentRoomData.participants || [];
        var names = currentRoomData.participantNames || {};

        byId('msg-room-modal-title').textContent =

        byId('msg-room-members').innerHTML = parts.map(function (uid) {

            return '<div class="msg-member">' +
                       '<span class="msg-dot' + (p && isOnline(p) ? ' on' : '') + '"></span>' +
                       '<span>' + esc(label) + (sub ? ' <span class="msg-member-role">' +
                            esc(sub) + '</span>' : '') + '</span>' +
                       (uid === meUid ? '<span class="msg-member-role">나</span>' : '') +
                   '</div>';

        // 초대·나가기는 임직원 전용 — 규칙이 참여자 목록 변경을 임직원으로 제한한다.
        byId('msg-notice-input').value = currentRoomData.notice || '';

        byId('msg-room-leave').hidden = !isEmployee ||

    /** 방 상단 고정 공지. 규칙상 참여자면 누구나 바꿀 수 있다(createdBy 만 잠겨 있다). */
    function renderNotice() {
        var box = byId('msg-notice');
        var body = byId('msg-notice-body');
        if (!box || !body) return;

        var text = currentRoomData && currentRoomData.notice;
        if (!text) { box.classList.remove('on'); return; }

        var by = currentRoomData.noticeSetterName || '';
        body.innerHTML = esc(text) +
            (by ? '<br><span class="msg-notice-by">— ' + esc(by) + '</span>' : '');
        box.classList.add('on');

    function saveNotice() {
        var d = getDb();
        if (!d || !currentRoomId) return;

        var text = String(byId('msg-notice-input').value || '').trim();
        d.collection('msgRooms').doc(currentRoomId).update({
            notice: text,
            noticeSetterName: text ? ((meData && meData.name) || '') : ''
        }).then(function () {

        }).catch(function (err) {
            console.error('[메신저] 공지 저장 실패:', err);

    function leaveRoom() {
        var d = getDb();
        if (!d || !currentRoomId || !currentRoomData) return;
        if (!confirm('이 대화방에서 나가시겠습니까?')) return;

        var roomId = currentRoomId;
        var parts = (currentRoomData.participants || []).slice();
        var next = parts.filter(function (u) { return u !== meUid; });

        // 마지막 한 사람이 나갈 때만 방이 사라진다 —
        // 방장이 남의 대화 기록을 일방적으로 지우지 못하게 하려는 규칙이다.
        var op = next.length === 0
            ? d.collection('msgRooms').doc(roomId).delete()
            : d.collection('msgRooms').doc(roomId).update({ participants: next });

        op.then(function () {
            byId('msg-room-modal').hidden = true;
            detachRoom();
            setChatHeader('대화', '');
            renderChatMessage('왼쪽에서 대화할 사람을 선택하세요.');
            document.body.classList.remove('msg-detail');
        }).catch(function (err) {
            console.error('[메신저] 나가기 실패:', err);
            alert('나가지 못했습니다.');

    // ── 거래처 모드 ───────────────────────────────────────────────────────
    //
    // 거래처(userType !== 'employee')는 msgProfiles 를 읽을 수 없다 → 조직도가 없다.
    // 게다가 방 개설도 규칙상 임직원만 가능하다. 그래서 거래처가 할 수 있는 일은
    // "담당 직원이 시작한 대화에 참여하는 것" 뿐이다. 화면도 그에 맞춘다.
    function startPartnerMode() {
        var d = getDb();
        if (!d) return;

        // 탭·버튼 정리 — 조직도와 그룹 만들기는 거래처에게 의미가 없다

        d.collection('msgPartners').doc(meUid).get()

                    );

                renderTreeMessage(
