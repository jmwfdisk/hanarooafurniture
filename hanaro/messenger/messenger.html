<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="icon" href="../../image/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="../../image/favicon.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="하나로오에이퍼니처 사내 메신저">
    <title>하나로 메신저</title>

    <!-- 외부 출처 사전 연결: 인증/DB 핸드셰이크를 미리 끝내 초기 로딩 단축 -->
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
    <link rel="dns-prefetch" href="https://www.googleapis.com">
    <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com">

    <!-- Firebase SDK (홈페이지와 동일 버전·compat 모드) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>

    <!-- 공통 인증 CSS (auth.js가 주입하는 로그인·마이페이지 모달이 이 스타일을 쓴다) -->
    <link rel="stylesheet" href="../css/auth.css">

    <!-- 로그인 UI 상태를 <html data-auth>로 확정: 첫 페인트부터 고정, 이후 auth.js가 이 속성만 갱신.
         홈페이지 전 페이지와 동일한 스니펫 — 비동기 인증 복원 중 깜빡임을 막는다. -->
    <script>(function(){try{var on=sessionStorage.getItem("loggedIn")==="true"&&!!sessionStorage.getItem("loggedInUser");document.documentElement.setAttribute("data-auth",on?"in":"out");}catch(e){}})();</script>

    <style>
        /* ── 메신저 전용 셸 ──────────────────────────────────────────────
           common.css를 include하지 않는다. 이 페이지는 사이트 네비(redesign.js)를
           쓰지 않는 전체화면 앱이라, 공용 디자인 시스템의 body 여백·타이포가
           오히려 레이아웃을 방해한다. 클래스는 전부 msg- 접두로 격리한다. */
        /* HTML의 hidden 속성을 항상 이기게 한다.
           브라우저 기본 [hidden]{display:none} 은 우선순위가 가장 낮아
           .클래스{display:flex} 하나만 있어도 무력화된다 —
           숨겨야 할 배너(답장·수정·녹음)가 화면에 그대로 남는 사고가 났다. */
        [hidden] { display: none !important; }

        :root {
            --msg-green: #44aa6b;
            --msg-green-dark: #3a8f5a;
            --msg-bg: #f5f5f7;
            --msg-line: #e5e5ea;
            --msg-text: #1c1c1e;
            --msg-sub: #8e8e93;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;              /* 앱 셸이므로 페이지 자체는 스크롤하지 않는다 */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         "Helvetica Neue", Arial, "Apple SD Gothic Neo", sans-serif;
            background: var(--msg-bg);
            color: var(--msg-text);
            -webkit-font-smoothing: antialiased;
        }

        button { cursor: pointer; font-family: inherit; }
        button:disabled { cursor: not-allowed; }

        /* 100vh는 모바일 브라우저 주소창 때문에 실제보다 커진다 → dvh 우선 */
        .msg-app {
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* ── 상단바 ── */
        .msg-topbar {
            flex: 0 0 auto;
            height: 56px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 16px;
            background: #fff;
            border-bottom: 1px solid var(--msg-line);
        }
        .msg-brand {
            font-size: 17px;
            font-weight: 700;
            color: var(--msg-green-dark);
            letter-spacing: -0.02em;
            white-space: nowrap;
        }
        .msg-topbar-spacer { flex: 1; }
        .msg-me {
            font-size: 13px;
            color: var(--msg-sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 40vw;
        }
        .msg-pill {
            border: 1px solid var(--msg-line);
            background: #fff;
            color: var(--msg-text);
            border-radius: 999px;
            padding: 7px 14px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
        }
        .msg-pill:hover { background: #f2f2f7; }

        /* ── 본문 2단 ── */
        .msg-body {
            flex: 1;
            display: flex;
            min-height: 0;                 /* 자식의 overflow가 동작하려면 필수 */
        }

        .msg-side {
            flex: 0 0 300px;
            width: 300px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: #fff;
            border-right: 1px solid var(--msg-line);
        }

        /* ── 좌측 탭 (대화 / 조직도) ── */
        .msg-tabs {
            flex: 0 0 auto;
            display: flex;
            border-bottom: 1px solid var(--msg-line);
        }
        .msg-tab {
            flex: 1;
            border: 0;
            background: transparent;
            padding: 12px 0 10px;
            font-size: 13px;
            font-weight: 700;
            color: var(--msg-sub);
            border-bottom: 2px solid transparent;
        }
        .msg-tab.active { color: var(--msg-green-dark); border-bottom-color: var(--msg-green); }
        .msg-tab-badge {
            display: inline-block;
            min-width: 18px;
            margin-left: 5px;
            padding: 1px 5px;
            border-radius: 999px;
            background: #ff3b30;
            color: #fff;
            font-size: 11px;
            line-height: 16px;
            vertical-align: 1px;
        }
        .msg-tab-badge[hidden] { display: none; }

        .msg-pane { display: none; flex: 1; min-height: 0; flex-direction: column; }
        .msg-pane.active { display: flex; }

        /* ── 대화 목록 ── */
        .msg-rooms { flex: 1; min-height: 0; overflow-y: auto; }
        .msg-room {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 0;
            background: transparent;
            padding: 11px 14px;
            text-align: left;
            border-bottom: 1px solid #f2f2f7;
        }
        .msg-room:hover { background: #f2f2f7; }
        .msg-room.selected { background: #e8f5ee; }
        .msg-room-text { flex: 1; min-width: 0; }
        .msg-room-top { display: flex; align-items: baseline; gap: 8px; }
        .msg-room-name {
            flex: 1; min-width: 0;
            font-size: 14px; font-weight: 600;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .msg-room-time { font-size: 11px; color: var(--msg-sub); white-space: nowrap; }
        .msg-room-last {
            font-size: 12px; color: var(--msg-sub);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .msg-unread {
            flex: 0 0 auto;
            min-width: 20px;
            padding: 2px 6px;
            border-radius: 999px;
            background: #ff3b30;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
        }

        .msg-search-wrap { padding: 12px; border-bottom: 1px solid var(--msg-line); }
        .msg-search {
            width: 100%;
            border: 1px solid var(--msg-line);
            background: var(--msg-bg);
            border-radius: 10px;
            padding: 9px 12px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
        }
        .msg-search:focus { border-color: var(--msg-green); background: #fff; }

        .msg-tree {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .msg-group-head {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 0;
            background: #fafafa;
            padding: 9px 14px;
            font-size: 12px;
            font-weight: 700;
            color: var(--msg-sub);
            text-align: left;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        .msg-caret { display: inline-block; transition: transform .15s; font-size: 10px; }
        .msg-group.collapsed .msg-caret { transform: rotate(-90deg); }
        .msg-group.collapsed .msg-group-list { display: none; }

        .msg-person {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 0;
            background: transparent;
            padding: 9px 14px;
            text-align: left;
        }
        .msg-person:hover { background: #f2f2f7; }
        .msg-person.selected { background: #e8f5ee; }
        .msg-avatar {
            flex: 0 0 auto;
            width: 34px; height: 34px;
            border-radius: 50%;
            background: var(--msg-green);
            color: #fff;
            font-size: 14px; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
        }
        .msg-person-text { min-width: 0; }
        .msg-person-name { font-size: 14px; font-weight: 600; }
        .msg-person-sub { font-size: 12px; color: var(--msg-sub); }
        .msg-person-name, .msg-person-sub {
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .msg-empty {
            padding: 40px 20px;
            text-align: center;
            font-size: 13px;
            color: var(--msg-sub);
            line-height: 1.7;
        }

        /* ── 우측 대화 영역 (1-A는 자리만) ── */
        .msg-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .msg-main-head {
            flex: 0 0 auto;
            height: 56px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 16px;
            background: #fff;
            border-bottom: 1px solid var(--msg-line);
        }
        .msg-back {
            display: none;
            border: 0; background: transparent;
            font-size: 20px; line-height: 1; padding: 4px 8px 6px;
            color: var(--msg-sub);
        }
        .msg-main-title { font-size: 15px; font-weight: 700; }
        .msg-main-sub { font-size: 12px; color: var(--msg-sub); }

        /* ── 방 공지 ── */
        .msg-notice {
            flex: 0 0 auto;
            display: none;
            align-items: flex-start;
            gap: 8px;
            padding: 10px 16px;
            background: #fffbe6;
            border-bottom: 1px solid #f0e4b0;
            font-size: 13px;
            line-height: 1.5;
        }
        .msg-notice.on { display: flex; }
        .msg-notice-body { flex: 1; white-space: pre-wrap; word-break: break-word; }
        .msg-notice-by { font-size: 11px; color: var(--msg-sub); }

        /* ── 대화 목록 ──
           `공통_채팅UI_바닥고정_스크롤_교훈.md` 의 정답 구조: 목록을 뒤집어
           **바닥 = 스크롤 오프셋 0** 으로 만든다. 웹은 column-reverse 한 줄이면 된다.
           데이터도 최신이 먼저 오도록(desc) 넣으므로 DOM 첫 자식 = 화면 맨 아래.

           ⚠️ 여기에 "바닥으로 스크롤" 장치를 덧대지 말 것.
              진입·새 메시지 도착·입력창 높이 변화가 전부 장치 없이 해결된다.
              장치를 더하면 서로 오프셋을 잡아당겨 진동이 생긴다 (STÉRO Chat 9차례 실패).
           트레이드오프: 짧은 대화는 화면 아래부터 쌓인다 — iMessage·텔레그램과 같은 패턴이며
           STÉRO Chat도 이 쪽으로 확정했다. */
        .msg-chat {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column-reverse;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 16px;
            gap: 4px;
        }
        .msg-chat-empty {
            margin: auto;
            text-align: center;
            font-size: 14px;
            color: var(--msg-sub);
            line-height: 1.8;
        }

        .msg-row { display: flex; gap: 8px; align-items: flex-end; margin-top: 4px; }
        .msg-row.mine { flex-direction: row-reverse; }
        .msg-bubble {
            max-width: min(70%, 560px);
            padding: 9px 13px;
            border-radius: 16px;
            background: #fff;
            border: 1px solid var(--msg-line);
            font-size: 14px;
            line-height: 1.55;
            white-space: pre-wrap;     /* 줄바꿈 보존 */
            word-break: break-word;    /* 긴 URL이 레이아웃을 밀지 않게 */
        }
        .msg-row.mine .msg-bubble {
            background: var(--msg-green);
            border-color: var(--msg-green);
            color: #fff;
        }
        .msg-bubble.deleted { font-style: italic; color: var(--msg-sub); background: #f2f2f7; }
        .msg-time { font-size: 11px; color: var(--msg-sub); white-space: nowrap; padding-bottom: 2px; }
        /* 상대가 아직 안 읽은 내 메시지 표시 (카카오톡의 '1'과 같은 자리) */
        .msg-unseen { font-size: 11px; font-weight: 700; color: #ffb300; padding-bottom: 2px; }

        /* ── 첨부 ── */
        .msg-bubble.media { padding: 4px; background: transparent; border: 0; }
        .msg-row.mine .msg-bubble.media { background: transparent; border: 0; }
        .msg-image {
            display: block;
            max-width: 260px;
            max-height: 320px;
            border-radius: 12px;
            border: 1px solid var(--msg-line);
            cursor: zoom-in;
            background: #f2f2f7;
        }
        .msg-file {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: inherit;
            min-width: 180px;
        }
        .msg-file-ico { font-size: 22px; flex: 0 0 auto; }
        .msg-file-name {
            font-size: 13px; font-weight: 600;
            word-break: break-all;
        }
        .msg-file-size { font-size: 11px; opacity: .75; }

        /* ── 앱(안드로이드)이 보낸 메시지를 웹에서도 제대로 보여주기 위한 요소들 ──
           ⚠️ 이 스타일이 없으면 답장 인용·반응·음성이 빈 말풍선으로 보인다(같은 스키마를 쓰므로). */

        /* ↩︎ 답장 인용 — 원문이 지워져도 남도록 보낼 때 스냅샷으로 저장된 값 */
        .msg-quote {
            border-left: 3px solid var(--msg-line);
            padding: 2px 0 2px 8px;
            margin-bottom: 5px;
            font-size: 12px;
            opacity: .8;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .msg-row.mine .msg-quote { border-left-color: rgba(255,255,255,.55); }
        .msg-quote-name { font-weight: 700; display: block; }

        /* ✏️ 수정됨 표시 */
        .msg-edited { font-size: 11px; color: var(--msg-sub); padding-bottom: 2px; }

        /* 🙂 이모지 반응 — 말풍선 아래 칩 */
        .msg-reactions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
        .msg-react {
            font-size: 11.5px;
            padding: 1px 7px;
            border-radius: 10px;
            background: #f2f2f7;
            border: 1px solid var(--msg-line);
            color: var(--msg-text);
            cursor: pointer;
        }
        .msg-react.on { background: #e4ecff; border-color: #b9ccff; }

        /* 🔎 대화 내 검색 */
        .msg-chatsearch {
            display: flex; gap: 8px; align-items: center;
            padding: 8px 14px;
            border-bottom: 1px solid var(--msg-line);
            background: #fafafa;
        }
        .msg-chatsearch[hidden] { display: none; }
        .msg-chatsearch input {
            flex: 1; min-width: 0;
            padding: 7px 10px;
            border: 1px solid var(--msg-line); border-radius: 10px;
            font: inherit; font-size: 13px;
        }

        /* ⚙️ 설정 모달 */
        .msg-set-sec {
            font-size: 11.5px; font-weight: 800; color: var(--msg-sub);
            padding: 14px 2px 6px;
        }
        .msg-set-row {
            display: flex; align-items: center; gap: 12px;
            width: 100%;
            padding: 11px 2px;
            border-top: 1px solid var(--msg-line);
            background: transparent;
            text-align: left;
            color: inherit; text-decoration: none;
            font: inherit;
        }
        .msg-set-row.as-btn { border-left: 0; border-right: 0; border-bottom: 0; cursor: pointer; }
        .msg-set-row > span:first-child { flex: 1; min-width: 0; }
        .msg-set-row b { display: block; font-size: 13.5px; font-weight: 600; }
        .msg-set-row small { display: block; margin-top: 2px; font-size: 11.5px; color: var(--msg-sub); }
        .msg-set-arrow { color: var(--msg-sub); font-size: 16px; }
        .msg-longtext {
            white-space: pre-wrap; word-break: break-word;
            font: inherit; font-size: 12.5px; line-height: 1.65;
            color: var(--msg-text); margin: 0;
        }
        /* 거래처 배정 목록 */
        .msg-partner-row { border-top: 1px solid var(--msg-line); padding: 10px 2px; }
        .msg-partner-name { font-size: 13.5px; font-weight: 700; }
        .msg-partner-sub { font-size: 11.5px; color: var(--msg-sub); margin-top: 2px; }
        .msg-partner-sub.none { color: #d93025; }
        .msg-partner-managers { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
        .msg-mgr {
            font-size: 11.5px; padding: 3px 9px; border-radius: 999px;
            border: 1px solid var(--msg-line); background: #fff; cursor: pointer;
        }
        .msg-mgr.on { background: var(--msg-green); border-color: var(--msg-green); color: #fff; }

        /* 📁 폴더 칩 */
        .msg-folders {
            display: flex; gap: 6px;
            padding: 8px 12px;
            overflow-x: auto;
            border-bottom: 1px solid var(--msg-line);
            scrollbar-width: none;
        }
        .msg-folders::-webkit-scrollbar { display: none; }
        .msg-chip {
            display: inline-flex; align-items: center; gap: 5px;
            flex: 0 0 auto;
            border: 0; cursor: pointer;
            padding: 5px 12px;
            border-radius: 999px;
            background: #f2f2f7;
            color: var(--msg-sub);
            font-size: 12.5px; font-weight: 700;
        }
        .msg-chip.on { background: var(--msg-green); color: #fff; }
        .msg-chip-badge { font-size: 10.5px; font-weight: 800; }
        .msg-chip.on .msg-chip-badge { color: #fff; }
        .msg-chip-add { font-size: 14px; font-weight: 800; padding: 5px 11px; }
        .msg-room-mark { margin-right: 3px; font-size: 11px; }

        /* ↩︎ 답장·수정 배너 */
        .msg-reply-bar {
            display: flex; align-items: center; gap: 8px;
            padding: 7px 14px;
            border-top: 1px solid var(--msg-line);
            background: #fafafa;
            font-size: 12.5px;
        }
        .msg-reply-mark { color: var(--msg-sub); }
        .msg-reply-body {
            flex: 1; min-width: 0;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .msg-reply-body b { margin-right: 6px; }

        /* 말풍선 메뉴 (우클릭 / 길게 누르기) */
        .msg-menu {
            position: fixed; z-index: 1200;
            background: #fff;
            border: 1px solid var(--msg-line);
            border-radius: 12px;
            box-shadow: 0 8px 28px rgba(0,0,0,.16);
            padding: 6px;
            min-width: 150px;
        }
        .msg-menu-emojis { display: flex; gap: 2px; padding: 2px 2px 6px; border-bottom: 1px solid var(--msg-line); }
        .msg-menu-emoji {
            border: 0; background: transparent; cursor: pointer;
            font-size: 17px; padding: 4px 5px; border-radius: 8px;
        }
        .msg-menu-emoji:hover { background: #f2f2f7; }
        .msg-menu-item {
            display: block; width: 100%;
            border: 0; background: transparent; cursor: pointer;
            text-align: left; font-size: 13.5px;
            padding: 8px 10px; border-radius: 8px;
            color: var(--msg-text);
        }
        .msg-menu-item:hover { background: #f2f2f7; }
        .msg-menu-item.danger { color: #d93025; }

        /* 🎤 음성 메시지 — 브라우저 기본 오디오 컨트롤을 그대로 쓴다(재생·탐색이 공짜) */
        .msg-audio { display: block; max-width: 240px; }
        .msg-audio-dur { font-size: 11px; opacity: .75; margin-top: 2px; }

        .msg-attach {
            flex: 0 0 auto;
            width: 40px; height: 40px;
            border: 1px solid var(--msg-line);
            border-radius: 12px;
            background: #fff;
            font-size: 17px;
            line-height: 1;
        }
        .msg-attach:hover:not(:disabled) { background: #f2f2f7; }

        .msg-upload {
            flex: 0 0 auto;
            display: none;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            font-size: 12px;
            color: var(--msg-sub);
            background: #fff;
            border-top: 1px solid var(--msg-line);
        }
        .msg-upload.on { display: flex; }
        .msg-progress {
            flex: 1;
            height: 4px;
            border-radius: 999px;
            background: var(--msg-line);
            overflow: hidden;
        }
        .msg-progress span {
            display: block; height: 100%; width: 0;
            background: var(--msg-green);
            transition: width .15s;
        }

        /* ── 온라인 표시 ── */
        .msg-dot {
            display: inline-block;
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #c7c7cc;
            margin-right: 5px;
            vertical-align: 0;
        }
        .msg-dot.on { background: #34c759; }

        /* ── 작성 중 표시 ── */
        .msg-typing {
            flex: 0 0 auto;
            height: 0;
            overflow: hidden;
            padding: 0 16px;
            font-size: 12px;
            color: var(--msg-sub);
            background: #fff;
            transition: height .12s ease;
        }
        .msg-typing.on { height: 24px; line-height: 24px; }
        .msg-sender { font-size: 12px; color: var(--msg-sub); margin: 6px 0 0 4px; }
        .msg-daysep {
            align-self: center;
            font-size: 11px;
            color: var(--msg-sub);
            background: rgba(0,0,0,.04);
            border-radius: 999px;
            padding: 3px 12px;
            margin: 10px 0 6px;
        }

        /* ── 입력바 ── */
        .msg-input-bar {
            flex: 0 0 auto;
            display: flex;
            gap: 8px;
            align-items: flex-end;
            padding: 10px 12px;
            background: #fff;
            border-top: 1px solid var(--msg-line);
        }
        .msg-input {
            flex: 1;
            min-height: 40px;
            max-height: 120px;
            resize: none;
            border: 1px solid var(--msg-line);
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 14px;
            font-family: inherit;
            line-height: 1.4;
            outline: none;
        }
        .msg-input:focus { border-color: var(--msg-green); }
        .msg-input:disabled { background: var(--msg-bg); }
        .msg-send {
            flex: 0 0 auto;
            height: 40px;
            padding: 0 18px;
            border: 0;
            border-radius: 999px;
            background: var(--msg-green);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
        }
        .msg-send:hover:not(:disabled) { background: var(--msg-green-dark); }
        .msg-send:disabled { background: #c7c7cc; }

        /* ── 그룹 만들기 (조직도 선택 모드) ── */
        .msg-side-actions {
            flex: 0 0 auto;
            display: flex;
            gap: 8px;
            padding: 0 12px 12px;
        }
        /* display 를 직접 지정한 요소는 hidden 속성만으로 숨지 않는다 (작성자 스타일이 이긴다).
           거래처 계정에서 '그룹 만들기' 를 감추려면 이 규칙이 필요하다. */
        .msg-side-actions[hidden] { display: none; }
        .msg-side-actions .msg-pill { flex: 1; text-align: center; }

        .msg-check {
            flex: 0 0 auto;
            width: 18px; height: 18px;
            border: 1.5px solid var(--msg-line);
            border-radius: 5px;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #fff;
        }
        body.msg-picking .msg-check { display: flex; }
        .msg-person.picked .msg-check { background: var(--msg-green); border-color: var(--msg-green); }

        .msg-pick-bar {
            flex: 0 0 auto;
            display: none;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border-top: 1px solid var(--msg-line);
            background: #fff;
        }
        body.msg-picking .msg-pick-bar { display: flex; }
        .msg-pick-count { flex: 1; font-size: 13px; color: var(--msg-sub); }

        /* ── 모달 (닫기는 알약형 텍스트 버튼 — 사이트 통일 규칙, 원형 × 금지) ── */
        .msg-modal {
            position: fixed;
            inset: 0;
            z-index: 9500;
            background: rgba(0,0,0,.35);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .msg-modal[hidden] { display: none; }
        .msg-modal-box {
            width: 100%;
            max-width: 380px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,.3);
            overflow: hidden;
        }
        .msg-modal-head {
            flex: 0 0 auto;
            padding: 18px 20px 12px;
            font-size: 16px;
            font-weight: 700;
        }
        .msg-modal-body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 20px 8px; }
        .msg-modal-foot {
            flex: 0 0 auto;
            display: flex;
            gap: 8px;
            padding: 12px 20px 18px;
        }
        .msg-modal-foot .msg-pill { flex: 1; text-align: center; padding: 10px 14px; }
        .msg-modal-foot .primary {
            background: var(--msg-green);
            border-color: var(--msg-green);
            color: #fff;
        }
        .msg-modal-foot .primary:hover { background: var(--msg-green-dark); }
        .msg-modal-foot .danger { color: #ff3b30; }
        .msg-modal-input {
            width: 100%;
            border: 1px solid var(--msg-line);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
        }
        .msg-modal-input:focus { border-color: var(--msg-green); }
        .msg-member {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 0;
            font-size: 14px;
            border-bottom: 1px solid #f2f2f7;
        }
        .msg-member-role { margin-left: auto; font-size: 11px; color: var(--msg-sub); }

        .msg-roommenu {
            margin-left: auto;
            border: 0; background: transparent;
            font-size: 18px; color: var(--msg-sub);
            padding: 4px 8px;
        }
        .msg-roommenu[hidden] { display: none; }

        /* ── 접근 확인 오버레이 ──
           로그인·권한이 확정되기 전에 조직도 뼈대가 잠깐이라도 보이면 안 된다. */
        .msg-gate {
            position: fixed;
            inset: 0;
            z-index: 9000;
            background: var(--msg-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--msg-sub);
        }
        .msg-gate[hidden] { display: none; }

        /* ── 모바일: 한 번에 한 화면만 ── */
        @media (max-width: 900px) {
            .msg-side { flex: 1 1 auto; width: 100%; border-right: 0; }
            .msg-main { display: none; }
            body.msg-detail .msg-side { display: none; }
            body.msg-detail .msg-main { display: flex; }
            .msg-back { display: block; }
        }
    </style>
</head>
